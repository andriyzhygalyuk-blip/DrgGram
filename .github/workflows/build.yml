name: Build DrgGram APK
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/* || true
      - name: Checkout DrgGram
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize Submodules
        run: |
          git submodule init
          git submodule update --init --recursive --depth=1
      - name: Check Prebuilt 100-Account C++ Core (v2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/prev /tmp/prev_libs
          REL_TAG=$(gh release view --json tagName -q .tagName || echo "")
          if [[ "$REL_TAG" == v2.* ]]; then
            gh release download "$REL_TAG" --pattern "DrgGram.apk" -D /tmp/prev --clobber || true
          fi
          if [ -f /tmp/prev/DrgGram.apk ]; then
            unzip -q /tmp/prev/DrgGram.apk "lib/*/*tmessages*.so" -d /tmp/prev_libs
            mkdir -p TMessagesProj/src/main/jniLibs
            cp -r /tmp/prev_libs/lib/* TMessagesProj/src/main/jniLibs/
            echo "FAST_BUILD=1" >> $GITHUB_ENV
          else
            echo "FAST_BUILD=0" >> $GITHUB_ENV
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK & NDK
        run: |
          API_VER=$(grep '^ENV ANDROID_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36")
          BT_VER=$(grep '^ENV ANDROID_BUILD_TOOLS_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36.0.0")
          NDK_VER=$(grep '^ENV ANDROID_NDK_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "27.2.12479018")
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          if [ "$FAST_BUILD" = "1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}"
          else
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}" "ndk;${NDK_VER}" "cmake;3.22.1"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi
      - name: Create DrgPluginManager.java
        run: |
          cat << 'EOF' > TMessagesProj/src/main/java/org/telegram/messenger/DrgPluginManager.java
          package org.telegram.messenger;
          import android.app.*;
          import android.content.*;
          import android.os.*;
          import android.view.*;
          import android.widget.*;
          import org.telegram.tgnet.*;
          import org.telegram.ui.ActionBar.ActionBarMenuSubItem;
          import org.telegram.ui.ActionBar.ActionBarPopupWindow;
          import org.telegram.ui.ActionBar.AlertDialog;
          import java.text.SimpleDateFormat;
          import java.util.*;
          public class DrgPluginManager {
          private static final String CH="drg_ch",BG="drg_bg";
          private static final String[] DEVS={"S~SM-S948B:37","S~SM-S946B:37","S~SM-S941B:37","S~SM-F976B:37","S~SM-F776B:37","G~11 Pro XL:37","G~11 Pro:37","G~11 Pro Fold:37","G~11:37","Sony XQ-GE54:37","M~XT2651-1:37","M~XT2601-2:37","Asus ASUSAI2601D:37","Asus ASUSAI2601H:37","N~A069P:37","S~SM-S938B:37","S~SM-S936B:37","S~SM-S931B:37","S~SM-F966B:37","S~SM-F766B:37","S~SM-S937B:37","G~10 Pro XL:37","G~10 Pro:37","G~10 Pro Fold:37","G~10:37","G~10a:37","Sony XQ-FS54:37","M~XT2551-6:36","M~XT2503-2:36","M~XT2505-1:36","Asus ASUSAI2501D:36","Asus ASUSAI2501H:36","N~A065:36","N~A059P:36","N~A059:36","S~SM-S928B:36","S~SM-S926B:36","S~SM-S921B:36","S~SM-F956B:36","S~SM-F741B:36","S~SM-S721B:36","G~9 Pro XL:36","G~9 Pro:36","G~9 Pro Fold:36","G~9:36","G~9a:36","Sony XQ-EC54:36","Sony XQ-ES54:35","M~XT2401-1:35","M~XT2451-3:35","M~XT2403-2:35","Asus ASUS_AI2401_A:35","Asus ASUS_AI2401_H:35","N~A015:35","HTC 2QDA100:35","HMD TA-1600:35","S~SM-A576B:36","S~SM-A376B:36","S~SM-A566B:36","S~SM-A366B:36","S~SM-A556B:36","S~SM-A356B:36","S~SM-M556B:35","G~8 Pro:36","G~8:36","G~8a:36","M~XT2429-1:35","M~XT2419-2:35","M~XT2435-1:35","N~A142:35","N~A001:35","HTC 2QCB100:34","HMD TA-1667:35","HMD TA-1632:35","HMD TA-1595:35","S~SM-S918B:35","S~SM-S916B:35","S~SM-S911B:35","S~SM-F946B:35","S~SM-F731B:35","S~SM-S711B:35","S~SM-A546B:35","S~SM-A346B:35","G~Fold:35","G~7 Pro:35","G~7:35","G~7a:35","Sony XQ-DQ54:35","Sony XQ-DE54:35","M~XT2301-4:34","M~XT2321-1:34","M~XT2303-2:34","Asus ASUS_AI2302:34","Asus ASUS_AI2205_A:34","N~A063:34","S~SM-S908B:34","S~SM-S906B:34","S~SM-F936B:34","G~6 Pro:34","Sony XQ-CT54:34"};
          public static volatile long lastDialogId=0;
          public static volatile int lastAccount=0;
          private static boolean started=false;
          private static final Map<String,Boolean> onlineMap=new HashMap<>();
          private static final Map<String,Long> onlineSince=new HashMap<>();
          private static final Map<Integer,String> msgCache=new HashMap<>();
          private static final Handler H=new Handler(Looper.getMainLooper());
          private static SharedPreferences sp(int a){return ApplicationLoader.applicationContext.getSharedPreferences("drg_acc_"+a,0);}
          private static SharedPreferences gsp(){return ApplicationLoader.applicationContext.getSharedPreferences("drg_global",0);}
          public static String getDevProfile(int a){String k="dev_"+a;String v=gsp().getString(k,null);if(v==null){int idx=(a>=0&&a<DEVS.length)?a:new Random().nextInt(DEVS.length);v=DEVS[idx].replace("S~","Samsung ").replace("G~","Google Pixel ").replace("M~","Motorola ").replace("N~","Nothing ");gsp().edit().putString(k,v).apply();}return v;}
          public static String getFakeDeviceModel(int a){return getDevProfile(a).split(":")[0];}
          public static String getFakeSystemVersion(int a){return "SDK "+getDevProfile(a).split(":")[1];}
          public static String getIsolatedRegId(int a,String o){return a==0?o:"";}
          public static int getActiveAccountsCount(){int c=0;for(int i=0;i<100;i++){try{if(UserConfig.getInstance(i).isClientActivated())c++;}catch(Throwable ignored){}}return Math.max(1,c);}
          private static String lang(){try{String l=LocaleController.getInstance().getCurrentLocaleInfo().getLangCode();return l!=null?l.toLowerCase(Locale.US):"en";}catch(Throwable t){return "en";}}
          public static String tr(String uk,String ru,String en){String l=lang();if(l.startsWith("uk"))return uk;if(l.startsWith("ru"))return ru;return en;}
          public static void toast(final String m){H.post(()->{try{Toast.makeText(ApplicationLoader.applicationContext,m,Toast.LENGTH_SHORT).show();}catch(Throwable ignored){}});}
          private static String now(){return new SimpleDateFormat("dd.MM.yyyy HH:mm:ss",Locale.getDefault()).format(new Date());}
          public static void log(int a,String e){try{String o=sp(a).getString("log","");String u="["+now()+"] "+e+"\n"+o;if(u.length()>25000)u=u.substring(0,25000);sp(a).edit().putString("log",u).apply();}catch(Throwable ignored){}}
          public static boolean isAntiDelete(int a){return sp(a).getBoolean("anti_del",false);}
          public static boolean isUnlimitedSelect(int a){return sp(a).getBoolean("unlim_sel",true);}
          public static boolean isVoiceTiming(int a){return sp(a).getBoolean("voice_time",false);}
          public static int getVoiceMode(int a){return sp(a).getInt("voice_mode",0);}
          public static boolean isMutedPm(int a,long did){return did>0&&sp(a).getBoolean("mute_pm_"+did,false);}
          public static boolean isGhostMaster(int a){return getGhostCount(a)>0;}
          public static boolean isGhostOpt(int a,int idx){return sp(a).getBoolean("ghost_"+idx,false);}
          public static int getGhostCount(int a){int c=0;for(int i=0;i<5;i++)if(isGhostOpt(a,i))c++;return c;}
          public static boolean shouldInterceptSendSchedule(int a){return sp(a).getBoolean("ghost_sched",false);}
          public static void onSendingMessage(int a,long did){try{if(sp(a).getBoolean("ghost_read_inter",true)&&isGhostOpt(a,0)){MessagesController.getInstance(a).markDialogAsRead(did,Integer.MAX_VALUE,Integer.MAX_VALUE,0,false,0,0,true,0);}if(isGhostOpt(a,2)||isGhostOpt(a,4)){H.postDelayed(()->{try{TLRPC.TL_account_updateStatus r=new TLRPC.TL_account_updateStatus();r.offline=true;ConnectionsManager.getInstance(a).sendRequest(r,(res,err)->{});}catch(Throwable ignored){}},400);}}catch(Throwable ignored){}}
          public static boolean shouldBlockRequest(int a,TLObject req){if(req==null)return false;String n=req.getClass().getSimpleName();if(isGhostOpt(a,0)&&(n.contains("readHistory")||n.contains("readDiscussion")||n.contains("readEncryptedHistory")))return true;if(isGhostOpt(a,1)&&n.contains("readStories"))return true;if(isGhostOpt(a,3)&&n.contains("setTyping"))return true;if((isGhostOpt(a,2)||isGhostOpt(a,4))&&n.contains("updateStatus")){try{req.getClass().getField("offline").setBoolean(req,true);}catch(Throwable ignored){}}return false;}
          public static CharSequence processOutgoingWithTiming(int a,CharSequence in){if(in==null)return null;onSendingMessage(a,lastDialogId);if(!isVoiceTiming(a))return in;try{MessageObject mo=MediaController.getInstance().getPlayingMessageObject();if(mo!=null&&(mo.isVoice()||mo.isRoundVideo())&&mo.getDialogId()==lastDialogId){int sec=(int)Math.round(mo.audioProgress*mo.getDuration());if(sec<=0)sec=mo.audioProgressSec;if(sec>0){String ts=String.format(Locale.US,"%02d:%02d ",sec/60,sec%60);if(!in.toString().startsWith(ts.trim()))return ts+in;}}}catch(Throwable ignored){}return in;}
          public static void transformVoicePcm(short[] pcm,int len){int mode=getVoiceMode(lastAccount);if(mode<=0||pcm==null||len<=0)return;float factor=1.0f;if(mode==1)factor=1.32f;else if(mode==2)factor=1.15f;else if(mode==3)factor=0.88f;else if(mode==4)factor=0.72f;else if(mode==6)factor=1.52f;if(mode==5){for(int i=0;i<len;i++){double mod=Math.sin(2.0*Math.PI*i*55.0/48000.0);pcm[i]=(short)Math.max(-32768,Math.min(32767,(int)(pcm[i]*mod*1.2)));}return;}short[] tmp=Arrays.copyOf(pcm,len);int win=512;for(int i=0;i<len;i++){int base=(i/win)*win;int off=(int)((i%win)*factor)%win;int idx=Math.min(len-1,base+off);int v=tmp[idx];if(i>0)v=(v*3+pcm[i-1])/4;pcm[i]=(short)Math.max(-32768,Math.min(32767,v));}}
          public static String getProfileBadge(int a,long uid){if(uid<=0)return "";try{TLRPC.User u=MessagesController.getInstance(a).getUser(uid);int dc=0;if(u!=null&&u.photo!=null)dc=u.photo.dc_id;String dcStr=dc>0?("DC"+dc):"DC2";String yr="~2024";if(uid<100000000L)yr="~2015";else if(uid<300000000L)yr="~2016";else if(uid<600000000L)yr="~2018";else if(uid<1000000000L)yr="~2019";else if(uid<1600000000L)yr="~2020";else if(uid<2200000000L)yr="~2021";else if(uid<5500000000L)yr="~2022";else if(uid<6800000000L)yr="~2023";else if(uid<7500000000L)yr="~2024";else yr="~2025-2026";String ph=(u!=null&&u.phone!=null&&!u.phone.isEmpty())?(" • +"+u.phone):"";return "ID: "+uid+" • "+dcStr+" • "+tr("Вік: ","Возраст: ","Age: ")+yr+ph;}catch(Throwable t){return "ID: "+uid;}}
          public static Set<String> watched(int a){return new HashSet<>(sp(a).getStringSet("watched",new HashSet<>()));}
          public static boolean isWatched(int a,long id){return watched(a).contains(String.valueOf(id));}
          public static void toggleWatch(int a,long id){Set<String> s=watched(a);String k=String.valueOf(id);if(s.contains(k))s.remove(k);else{s.add(k);startWatcher();}sp(a).edit().putStringSet("watched",s).apply();}
          public static void markDeleted(int a,ArrayList<Integer> ids){if(ids==null||ids.isEmpty())return;try{Set<String> d=new HashSet<>(sp(a).getStringSet("del_ids",new HashSet<>()));boolean chg=false;for(Integer id:ids){if(id==null)continue;String sid=String.valueOf(id);if(d.contains(sid))continue;String cached=msgCache.get(id);if(cached!=null){d.add(sid);chg=true;log(a,tr("Видалено від ","Удалено от ","Deleted from ")+cached);notify(tr("Видалене повідомлення","Удаленное сообщение","Deleted message"),cached);}}if(chg){sp(a).edit().putStringSet("del_ids",d).apply();H.post(()->NotificationCenter.getInstance(a).postNotificationName(NotificationCenter.updateInterfaces,0));}}catch(Throwable ignored){}}
          public static boolean isMessageDeleted(int id){return sp(lastAccount).getStringSet("del_ids",Collections.emptySet()).contains(String.valueOf(id));}
          public static void notify(String t,String msg){try{Context c=ApplicationLoader.applicationContext;NotificationManager nm=(NotificationManager)c.getSystemService(Context.NOTIFICATION_SERVICE);if(Build.VERSION.SDK_INT>=26)nm.createNotificationChannel(new NotificationChannel(CH,"DrgGram",NotificationManager.IMPORTANCE_HIGH));Notification.Builder b=Build.VERSION.SDK_INT>=26?new Notification.Builder(c,CH):new Notification.Builder(c);b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(t).setContentText(msg).setAutoCancel(true);nm.notify(new Random().nextInt(900000)+1000,b.build());}catch(Throwable ignored){}}
          public static void ensureForegroundService(Service s){try{startWatcher();}catch(Throwable ignored){}}
          public static void startWatcher(){if(started)return;started=true;H.postDelayed(new Runnable(){@Override public void run(){try{final int a=lastAccount;Set<String> w=watched(a);if(isAntiDelete(a)||!w.isEmpty()){ConnectionsManager.getInstance(a).setAppPaused(false,false);ConnectionsManager.getInstance(a).resumeNetworkMaybe();}if(!w.isEmpty()){TLRPC.TL_users_getUsers r=new TLRPC.TL_users_getUsers();for(String s:w){try{long uid=Long.parseLong(s);if(uid==777000)continue;TLRPC.InputUser iu=MessagesController.getInstance(a).getInputUser(uid);if(iu!=null)r.id.add(iu);}catch(Throwable ignored){}}if(!r.id.isEmpty())ConnectionsManager.getInstance(a).sendRequest(r,(res,err)->{if(res instanceof org.telegram.tgnet.Vector){org.telegram.tgnet.Vector vec=(org.telegram.tgnet.Vector)res;for(int i=0;i<vec.objects.size();i++){Object o=vec.objects.get(i);if(o instanceof TLRPC.User)checkOnline(a,(TLRPC.User)o);}}});}}catch(Throwable ignored){}H.postDelayed(this,20000);}},5000);}
          private static String userLabel(TLRPC.User u,long fallbackId){if(u==null)return "ID "+fallbackId;String fn=(u.first_name!=null?u.first_name:"")+((u.last_name!=null&&!u.last_name.isEmpty())?(" "+u.last_name):"");if(u.username!=null&&!u.username.isEmpty())fn+=" (@"+u.username+")";return fn.trim().isEmpty()?("ID "+u.id):fn.trim();}
          private static void checkOnline(int a,TLRPC.User u){if(u==null||u.id==777000||!isWatched(a,u.id))return;boolean on=u.status!=null&&u.status.getClass().getSimpleName().toLowerCase(Locale.US).contains("online");String mk=a+"_"+u.id;Boolean p=onlineMap.get(mk);onlineMap.put(mk,on);String who=userLabel(u,u.id);if(on&&(p==null||!p)){onlineSince.put(mk,System.currentTimeMillis());String m=who+tr(" — ЗАЙШОВ ОНЛАЙН"," — ВОШЕЛ В СЕТЬ"," — WENT ONLINE");log(a,m);notify(tr("Онлайн радар","Онлайн радар","Online Radar"),m+" ("+now()+")");}else if(!on&&p!=null&&p){Long st=onlineSince.get(mk);long dur=st!=null?Math.max(1,(System.currentTimeMillis()-st)/1000):0;String dStr=dur>0?(" ("+(dur/60)+"m "+(dur%60)+"s)"):"";String m=who+tr(" — ВИЙШОВ З МЕРЕЖІ"," — ВЫШЕЛ ИЗ СЕТИ"," — WENT OFFLINE")+dStr;log(a,m);}}
          @SuppressWarnings("unchecked") public static void onProcessUpdates(int a,ArrayList<TLRPC.Update> ups){if(ups==null)return;try{Iterator<TLRPC.Update> it=ups.iterator();while(it.hasNext()){TLRPC.Update u=it.next();if(u==null)continue;String cn=u.getClass().getSimpleName();if(cn.contains("updateNewMessage")&&!cn.contains("Channel")){try{Object mo=u.getClass().getField("message").get(u);if(mo instanceof TLRPC.Message){TLRPC.Message m=(TLRPC.Message)mo;if(m.peer_id!=null&&m.peer_id.user_id>0&&m.peer_id.chat_id==0&&m.peer_id.channel_id==0){long uid=m.peer_id.user_id;if(!m.out&&isMutedPm(a,uid)){ArrayList<Integer> del=new ArrayList<>();del.add(m.id);MessagesController.getInstance(a).deleteMessages(del,null,null,uid,0,true,0);it.remove();continue;}if(m.message!=null){TLRPC.User usr=MessagesController.getInstance(a).getUser(uid);msgCache.put(m.id,userLabel(usr,uid)+": "+m.message);}}}}catch(Throwable ignored){}}else if(cn.contains("updateUserStatus")){try{long uid=u.getClass().getField("user_id").getLong(u);TLRPC.UserStatus st=(TLRPC.UserStatus)u.getClass().getField("status").get(u);TLRPC.User usr=MessagesController.getInstance(a).getUser(uid);if(usr!=null){usr.status=st;checkOnline(a,usr);}}catch(Throwable ignored){}}else if(cn.equals("TL_updateDeleteMessages")&&isAntiDelete(a)){try{ArrayList<Integer> ids=(ArrayList<Integer>)u.getClass().getField("messages").get(u);markDeleted(a,ids);it.remove();}catch(Throwable ignored){}}}}catch(Throwable ignored){}}
          public static void onChatResume(long did,int a){lastDialogId=did;lastAccount=a;}
          public static void openDrgMenu(final View anchor){try{final Context ctx=anchor.getContext();final long did=lastDialogId;final int a=lastAccount;final ActionBarPopupWindow.ActionBarPopupWindowLayout layout=new ActionBarPopupWindow.ActionBarPopupWindowLayout(ctx);final ActionBarPopupWindow popup=new ActionBarPopupWindow(layout,-2,-2);popup.setOutsideTouchable(true);popup.setClippingEnabled(true);
          ActionBarMenuSubItem iGhost=new ActionBarMenuSubItem(ctx,true,false);iGhost.setTextAndIcon(tr("Режим привида ","Режим призрака ","Ghost mode ")+getGhostCount(a)+"/5",R.drawable.msg_secret);iGhost.setOnClickListener(v->{popup.dismiss();openGhostDialog(ctx,a);});layout.addView(iGhost);
          ActionBarMenuSubItem iFwd=new ActionBarMenuSubItem(ctx,false,false);iFwd.setTextAndIcon(tr("Переслати чат","Переслать чат","Forward chat"),R.drawable.msg_forward);iFwd.setOnClickListener(v->{popup.dismiss();if(did!=0)pickTarget(ctx,a,did);});layout.addView(iFwd);
          final ActionBarMenuSubItem iOn=new ActionBarMenuSubItem(ctx,false,false);iOn.setTextAndIcon(tr("Онлайн радар: ","Онлайн радар: ","Online radar: ")+(did>0&&isWatched(a,did)?"ON":"OFF"),R.drawable.msg_contacts);iOn.setOnClickListener(v->{if(did>0&&did!=777000){toggleWatch(a,did);iOn.setText(tr("Онлайн радар: ","Онлайн радар: ","Online radar: ")+(isWatched(a,did)?"ON":"OFF"));}});layout.addView(iOn);
          final ActionBarMenuSubItem iAd=new ActionBarMenuSubItem(ctx,false,false);iAd.setTextAndIcon(tr("Анти-видалення: ","Анти-удаление: ","Anti-delete: ")+(isAntiDelete(a)?"ON":"OFF"),R.drawable.msg_delete);iAd.setOnClickListener(v->{boolean nx=!isAntiDelete(a);sp(a).edit().putBoolean("anti_del",nx).apply();iAd.setText(tr("Анти-видалення: ","Анти-удаление: ","Anti-delete: ")+(nx?"ON":"OFF"));});layout.addView(iAd);
          final ActionBarMenuSubItem iSel=new ActionBarMenuSubItem(ctx,false,false);iSel.setTextAndIcon("Unlimited select: "+(isUnlimitedSelect(a)?"ON":"OFF"),R.drawable.msg_check);iSel.setOnClickListener(v->{boolean nx=!isUnlimitedSelect(a);sp(a).edit().putBoolean("unlim_sel",nx).apply();iSel.setText("Unlimited select: "+(nx?"ON":"OFF"));});layout.addView(iSel);
          String[] vNames={"OFF",tr("Ніжний жін.","Нежный жен.","Soft Female"),tr("Грубий жін.","Грубый жен.","Deep Female"),tr("Ніжний чол.","Нежный муж.","Soft Male"),tr("Грубий чол.","Грубый муж.","Deep Male"),tr("Робот","Робот","Robot"),tr("Дитина","Ребенок","Child")};
          ActionBarMenuSubItem iVc=new ActionBarMenuSubItem(ctx,false,false);iVc.setTextAndIcon(tr("Голос: ","Голос: ","Voice: ")+vNames[getVoiceMode(a)],R.drawable.msg_voice_bluetooth);iVc.setOnClickListener(v->{popup.dismiss();new AlertDialog.Builder(ctx).setTitle(tr("Зміна голосу","Изменение голоса","Voice Changer")).setItems(vNames,(d,w)->sp(a).edit().putInt("voice_mode",w).apply()).show();});layout.addView(iVc);
          final ActionBarMenuSubItem iVt=new ActionBarMenuSubItem(ctx,false,false);iVt.setTextAndIcon("Voice timing: "+(isVoiceTiming(a)?"ON":"OFF"),R.drawable.msg_speed);iVt.setOnClickListener(v->{boolean nx=!isVoiceTiming(a);sp(a).edit().putBoolean("voice_time",nx).apply();iVt.setText("Voice timing: "+(nx?"ON":"OFF"));});layout.addView(iVt);
          final ActionBarMenuSubItem iMp=new ActionBarMenuSubItem(ctx,false,false);iMp.setTextAndIcon(tr("Мут в ЛС: ","Мут в ЛС: ","Mute PM: ")+(isMutedPm(a,did)?"ON":"OFF"),R.drawable.msg_mute);iMp.setOnClickListener(v->{if(did>0){boolean nx=!isMutedPm(a,did);sp(a).edit().putBoolean("mute_pm_"+did,nx).apply();iMp.setText(tr("Мут в ЛС: ","Мут в ЛС: ","Mute PM: ")+(nx?"ON":"OFF"));}});layout.addView(iMp);
          ActionBarMenuSubItem iOd=new ActionBarMenuSubItem(ctx,false,false);iOd.setTextAndIcon("Own message delete",R.drawable.msg_clear);iOd.setOnClickListener(v->{popup.dismiss();addTrashConfirmButton(anchor,ctx,a,did);});layout.addView(iOd);
