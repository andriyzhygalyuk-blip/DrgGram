name: Build DrgGram APK
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/* || true
      - name: Checkout DrgGram
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize Submodules
        run: |
          git submodule init
          git submodule update --init --recursive --depth=1
      - name: Check Prebuilt 100-Account C++ Core (v2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/prev /tmp/prev_libs
          REL_TAG=$(gh release view --json tagName -q .tagName || echo "")
          if [[ "$REL_TAG" == v2.* ]]; then
            gh release download "$REL_TAG" --pattern "DrgGram.apk" -D /tmp/prev --clobber || true
          fi
          if [ -f /tmp/prev/DrgGram.apk ]; then
            unzip -q /tmp/prev/DrgGram.apk "lib/*/*tmessages*.so" -d /tmp/prev_libs
            mkdir -p TMessagesProj/src/main/jniLibs
            cp -r /tmp/prev_libs/lib/* TMessagesProj/src/main/jniLibs/
            echo "FAST_BUILD=1" >> $GITHUB_ENV
          else
            echo "FAST_BUILD=0" >> $GITHUB_ENV
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK & NDK
        run: |
          API_VER=$(grep '^ENV ANDROID_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36")
          BT_VER=$(grep '^ENV ANDROID_BUILD_TOOLS_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36.0.0")
          NDK_VER=$(grep '^ENV ANDROID_NDK_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "27.2.12479018")
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          if [ "$FAST_BUILD" = "1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}"
          else
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}" "ndk;${NDK_VER}" "cmake;3.22.1"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi
      - name: Install DrgGram Sources & Run Patch
        env:
          RUN_NO: ${{ github.run_number }}
        run: |
          cp -f Drg*.java TMessagesProj/src/main/java/org/telegram/messenger/
          pip3 install Pillow --quiet || sudo apt-get install -y python3-pil
          python3 patch.py
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile DrgGram APK
        run: |
          gradle --parallel :TMessagesProj_AppStandalone:assembleAfatStandalone
          find . -path "*/outputs/apk/*" -name "*.apk" -exec cp {} ./DrgGram.apk \;
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.44.${{ github.run_number }}
          name: "DrgGram v2.44 (Build #${{ github.run_number }})"
          body: "Модульна збірка DrgGram + мультимовний менеджер Проксі!"
          files: ./DrgGram.apk
# === КІНЕЦЬ ФАЙЛУ ===
