name: Build DrgGram APK
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/* || true
      - name: Checkout DrgGram
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize Submodules
        run: |
          git submodule init
          git submodule update --init --recursive --depth=1
      - name: Check Prebuilt 100-Account C++ Core (v2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/prev /tmp/prev_libs
          REL_TAG=$(gh release view --json tagName -q .tagName || echo "")
          if [[ "$REL_TAG" == v2.* ]]; then
            gh release download "$REL_TAG" --pattern "DrgGram.apk" -D /tmp/prev --clobber || true
          fi
          if [ -f /tmp/prev/DrgGram.apk ]; then
            unzip -q /tmp/prev/DrgGram.apk "lib/*/*tmessages*.so" -d /tmp/prev_libs
            mkdir -p TMessagesProj/src/main/jniLibs
            cp -r /tmp/prev_libs/lib/* TMessagesProj/src/main/jniLibs/
            echo "FAST_BUILD=1" >> $GITHUB_ENV
          else
            echo "FAST_BUILD=0" >> $GITHUB_ENV
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK & NDK
        run: |
          API_VER=$(grep '^ENV ANDROID_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36")
          BT_VER=$(grep '^ENV ANDROID_BUILD_TOOLS_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36.0.0")
          NDK_VER=$(grep '^ENV ANDROID_NDK_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "27.2.12479018")
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          if [ "$FAST_BUILD" = "1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}"
          else
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}" "ndk;${NDK_VER}" "cmake;3.22.1"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi
      - name: Create DrgPluginManager.java
        run: |
          cat << 'EOF' > TMessagesProj/src/main/java/org/telegram/messenger/DrgPluginManager.java
          package org.telegram.messenger;
          import android.app.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.media.AudioRecord;
          import android.media.MediaPlayer;
          import android.os.*;
          import android.text.*;
          import android.text.style.ReplacementSpan;
          import android.util.TypedValue;
          import android.view.*;
          import android.widget.*;
          import org.telegram.tgnet.*;
          import org.telegram.ui.ActionBar.ActionBarMenuSubItem;
          import org.telegram.ui.ActionBar.ActionBarPopupWindow;
          import org.telegram.ui.ActionBar.AlertDialog;
          import org.telegram.ui.ActionBar.Theme;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.text.SimpleDateFormat;
          import java.util.*;
          public class DrgPluginManager {
          private static final String CH="drg_ch_v2";
          private static final String[] DEVS={"Samsung SM-S948B:37","Samsung SM-S946B:37","Samsung SM-F976B:37","Google Pixel 11 Pro XL:37","Google Pixel 11 Pro:37","Sony XQ-GE54:37","Motorola XT2651-1:37","Asus ASUS_AI2601D:37","Nothing A069P:37","Samsung SM-S938B:37","Google Pixel 10 Pro XL:37","Motorola XT2551-6:36","Asus ASUS_AI2501D:36","Nothing A065:36","Samsung SM-S928B:36","Google Pixel 9 Pro XL:36","Sony XQ-EC54:36","Motorola XT2401-1:35","Samsung SM-A576B:36","Google Pixel 8 Pro:36","Samsung SM-S918B:35","Google Pixel 7 Pro:35","Motorola XT2301-4:34","Samsung SM-S908B:34","Google Pixel 6 Pro:34"};
          public static volatile long lastDialogId=0,allowReadUntil=0;
          public static volatile int lastAccount=0;
          public static volatile View currentRootView=null;
          private static volatile TLObject cachedOfflineReq=null;
          private static boolean started=false,inChunkDel=false;
          private static final boolean[] obsAccounts=new boolean[100];
          private static final float[] vRing=new float[8192];
          private static int vWrite=0;
          private static double vPhase=0.0,vRobPhase=0.0,vLp1=0.0,vLp2=0.0;
          private static final Map<String,Boolean> onlineMap=new HashMap<>();
          private static final Map<String,Long> onlineSince=new HashMap<>();
          private static final Set<Integer> mutedHandled=Collections.synchronizedSet(new HashSet<>());
          private static final Handler H=new Handler(Looper.getMainLooper());
          private static SharedPreferences sp(int a){return ApplicationLoader.applicationContext.getSharedPreferences("drg_acc_"+a,0);}
          private static SharedPreferences gsp(){return ApplicationLoader.applicationContext.getSharedPreferences("drg_global",0);}
          public static void playFirstLaunchSound(){try{if(gsp().getBoolean("intro_wav_v1",false))return;gsp().edit().putBoolean("intro_wav_v1",true).apply();MediaPlayer mp=MediaPlayer.create(ApplicationLoader.applicationContext,R.raw.drg_intro_sound);if(mp!=null){mp.setOnCompletionListener(m->{try{m.release();}catch(Throwable ignored){}});mp.start();}}catch(Throwable ignored){}}
          public static void applyIntroLogoOverlay(final View root){playFirstLaunchSound();if(root==null)return;for(int delay:new int[]{30,120,350}){H.postDelayed(()->{try{List<View> all=new ArrayList<>();collectViews(root,all);View animV=null;for(View v:all){if(v instanceof TextView){CharSequence cs=((TextView)v).getText();if(cs!=null&&("Telegram".equalsIgnoreCase(cs.toString().trim())||cs.toString().contains("DrgGram"))){((TextView)v).setText("DrgGram");}}else if(v instanceof TextureView||v instanceof SurfaceView||v.getClass().getSimpleName().contains("RLottie")||v.getClass().getSimpleName().contains("Intro")){animV=v;v.setVisibility(View.INVISIBLE);}}if(animV!=null&&animV.getParent() instanceof ViewGroup){ViewGroup p=(ViewGroup)animV.getParent();if(p.findViewWithTag("drg_intro_logo")==null){ImageView iv=new ImageView(p.getContext());iv.setTag("drg_intro_logo");iv.setImageResource(R.drawable.drg_intro_clean);iv.setScaleType(ImageView.ScaleType.FIT_CENTER);int sz=Math.max(AndroidUtilities.dp(145),animV.getHeight());FrameLayout.LayoutParams lp=new FrameLayout.LayoutParams(sz,sz,Gravity.CENTER_HORIZONTAL);if(animV.getLayoutParams() instanceof ViewGroup.MarginLayoutParams)lp.topMargin=((ViewGroup.MarginLayoutParams)animV.getLayoutParams()).topMargin;p.addView(iv,lp);}}}catch(Throwable ignored){}},delay);}}
          public static void onLaunchResume(final Context ctx){playFirstLaunchSound();if(ctx instanceof Activity)currentRootView=((Activity)ctx).getWindow().getDecorView();try{for(int i=0;i<100;i++)if(UserConfig.getInstance(i).isClientActivated())autoJoinChannel(i);}catch(Throwable ignored){}}
          private static void collectViews(View v,List<View> out){if(v==null)return;out.add(v);if(v instanceof ViewGroup){ViewGroup vg=(ViewGroup)v;for(int i=0;i<vg.getChildCount();i++)collectViews(vg.getChildAt(i),out);}}
          public static void autoJoinChannel(final int a){try{if(!UserConfig.getInstance(a).isClientActivated()||sp(a).getBoolean("joined_drggram_v2",false))return;sp(a).edit().putBoolean("joined_drggram_v2",true).apply();TLRPC.TL_contacts_resolveUsername req=new TLRPC.TL_contacts_resolveUsername();req.username="DrgGram";ConnectionsManager.getInstance(a).sendRequest(req,(res,err)->{if(res instanceof TLRPC.TL_contacts_resolvedPeer){TLRPC.TL_contacts_resolvedPeer rp=(TLRPC.TL_contacts_resolvedPeer)res;if(rp.chats!=null&&!rp.chats.isEmpty()){TLRPC.Chat chat=rp.chats.get(0);MessagesController.getInstance(a).putChats(rp.chats,false);TLRPC.TL_channels_joinChannel j=new TLRPC.TL_channels_joinChannel();j.channel=MessagesController.getInstance(a).getInputChannel(chat.id);ConnectionsManager.getInstance(a).sendRequest(j,(r2,e2)->{});}}else sp(a).edit().putBoolean("joined_drggram_v2",false).apply();});}catch(Throwable ignored){}}
          public static String getDevProfile(int a){int s=(a>=0&&a<100)?a:0;String k="dev_slot_"+s,v=gsp().getString(k,null);if(v==null){String b=DEVS[s%DEVS.length];v=s<DEVS.length?b:b.replace(":"," #"+(s/DEVS.length)+":");gsp().edit().putString(k,v).commit();}return v;}
          public static String getFakeDeviceModel(int a){return getDevProfile(a).split(":")[0];}
          public static String getFakeSystemVersion(int a){return "SDK "+getDevProfile(a).split(":")[1];}
          public static String getIsolatedRegId(int a,String o){return a==0?o:"";}
          public static List<Integer> getSortedActiveAccounts(){List<Integer> l=new ArrayList<>();for(int i=0;i<100;i++){try{if(UserConfig.getInstance(i).isClientActivated())l.add(i);}catch(Throwable ignored){}}Collections.sort(l,(o1,o2)->Integer.compare(UserConfig.getInstance(o1).loginTime,UserConfig.getInstance(o2).loginTime));return l;}
          public static int getActiveAccountsCount(){return Math.max(1,getSortedActiveAccounts().size());}
          public static String formatAddAccountLabel(String base){if(base!=null&&base.contains("/100)"))return base;String b=(base!=null&&!base.isEmpty())?base:tr("Додати акаунт","Добавить аккаунт","Add Account");return "("+getActiveAccountsCount()+"/100) "+b;}
          public static Drawable makeGridForeground(final View host){return new Drawable(){private final Paint p=new Paint(Paint.ANTI_ALIAS_FLAG);@Override public void draw(Canvas c){int h=host.getHeight(),w=host.getWidth();if(h<AndroidUtilities.dp(32)||w<=0)return;int col=Theme.getColor(Theme.key_actionBarDefaultSubmenuItemIcon);p.setColor((col&0x00FFFFFF)|0xB0000000);float cx=w-AndroidUtilities.dp(20),cy=h/2f,r=AndroidUtilities.dp(1.8f);int dx=AndroidUtilities.dp(3),dy=AndroidUtilities.dp(5);for(int ry=-1;ry<=1;ry++){c.drawCircle(cx-dx,cy+ry*dy,r,p);c.drawCircle(cx+dx,cy+ry*dy,r,p);}}@Override public void setAlpha(int a){}@Override public void setColorFilter(ColorFilter cf){}@Override public int getOpacity(){return PixelFormat.TRANSLUCENT;}};}
          public static void attachAccountReorderHook(final View addAccItem,final TextView tv){if(addAccItem==null)return;try{if(tv!=null){tv.setTextSize(TypedValue.COMPLEX_UNIT_DIP,14f);tv.setSingleLine(true);}}catch(Throwable ignored){}for(int delay:new int[]{50,180,420}){H.postDelayed(()->{try{ViewParent vp=addAccItem.getParent();if(!(vp instanceof ViewGroup))return;final ViewGroup vg=(ViewGroup)vp;final List<View> accViews=new ArrayList<>();int firstAccIdx=-1;for(int i=0;i<vg.getChildCount();i++){View ch=vg.getChildAt(i);if(ch==addAccItem)continue;if(ch instanceof ViewGroup&&ch.getVisibility()==View.VISIBLE&&ch.getHeight()>=AndroidUtilities.dp(32)){if(firstAccIdx<0)firstAccIdx=i;accViews.add(ch);}else if(Build.VERSION.SDK_INT>=23)ch.setForeground(null);}final int minIdx=firstAccIdx>=0?firstAccIdx:2;final List<Integer> accIds=getSortedActiveAccounts();for(int i=0;i<accViews.size()&&i<accIds.size();i++){final View row=accViews.get(i);row.setWillNotDraw(false);if(Build.VERSION.SDK_INT>=23)row.setForeground(makeGridForeground(row));row.invalidate();if("drg_grid_v2".equals(row.getTag()))continue;row.setTag("drg_grid_v2");row.setOnLongClickListener(v->{v.setTag(0x7F000001,Boolean.TRUE);v.setAlpha(0.75f);v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);return true;});row.setOnTouchListener(new View.OnTouchListener(){float downY=0;boolean dragging=false;@Override public boolean onTouch(View v,MotionEvent ev){int act=ev.getActionMasked();if(act==MotionEvent.ACTION_DOWN){downY=ev.getRawY();if(ev.getX()>=v.getWidth()-AndroidUtilities.dp(48)){dragging=true;vg.requestDisallowInterceptTouchEvent(true);if(vg.getParent()!=null)vg.getParent().requestDisallowInterceptTouchEvent(true);v.setAlpha(0.75f);v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);return true;}dragging=false;return false;}if(!dragging&&Boolean.TRUE.equals(v.getTag(0x7F000001))){dragging=true;downY=ev.getRawY();vg.requestDisallowInterceptTouchEvent(true);if(vg.getParent()!=null)vg.getParent().requestDisallowInterceptTouchEvent(true);}if(!dragging)return false;if(act==MotionEvent.ACTION_MOVE){float dy=ev.getRawY()-downY;v.setTranslationY(dy*0.4f);int step=Math.max(AndroidUtilities.dp(36),v.getHeight()*3/4);if(Math.abs(dy)>=step){int curIdx=vg.indexOfChild(v),targetIdx=dy>0?curIdx+1:curIdx-1;if(targetIdx>=minIdx&&targetIdx<vg.getChildCount()){v.setTranslationY(0f);vg.removeViewAt(curIdx);vg.addView(v,targetIdx);downY=ev.getRawY();v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);saveNewOrderFromPopup(vg,accViews,accIds);}}return true;}else if(act==MotionEvent.ACTION_UP||act==MotionEvent.ACTION_CANCEL){v.setTranslationY(0f);v.setAlpha(1.0f);v.setTag(0x7F000001,null);dragging=false;return true;}return true;}});}}catch(Throwable ignored){}},delay);}}
          private static void saveNewOrderFromPopup(ViewGroup vg,List<View> origViews,List<Integer> origAccs){try{int baseTime=100000,rank=0;for(int i=0;i<vg.getChildCount();i++){int origIdx=origViews.indexOf(vg.getChildAt(i));if(origIdx>=0&&origIdx<origAccs.size()){int acc=origAccs.get(origIdx);UserConfig.getInstance(acc).loginTime=baseTime+(rank*100);UserConfig.getInstance(acc).saveConfig(false);rank++;}}}catch(Throwable ignored){}}
          public static CharSequence prependSvgTrashSpan(CharSequence timeStr){if(timeStr==null||(timeStr instanceof Spanned&&timeStr.toString().startsWith("  ")))return timeStr;SpannableStringBuilder ssb=new SpannableStringBuilder("  ").append(timeStr);ssb.setSpan(new ReplacementSpan(){@Override public int getSize(Paint p,CharSequence t,int s,int e,Paint.FontMetricsInt fm){return AndroidUtilities.dp(14);}@Override public void draw(Canvas c,CharSequence t,int s,int e,float x,int top,int y,int bottom,Paint p){try{Drawable d=ApplicationLoader.applicationContext.getResources().getDrawable(R.drawable.msg_delete).mutate();d.setColorFilter(new PorterDuffColorFilter(p.getColor(),PorterDuff.Mode.SRC_IN));int sz=AndroidUtilities.dp(11),dy=top+(bottom-top-sz)/2;d.setBounds((int)x,dy,(int)x+sz,dy+sz);d.draw(c);}catch(Throwable ignored){}}},0,1,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);return ssb;}
          public static GradientDrawable makeLiquidGlass(int radDp){GradientDrawable g=new GradientDrawable();g.setColor(0xE618222D);g.setCornerRadius(AndroidUtilities.dp(radDp));g.setStroke(Math.max(1,AndroidUtilities.dp(1)),0x33FFFFFF);return g;}
          public static void updateProgressBanner(final String text,final boolean hide){H.post(()->{try{if(!(currentRootView instanceof ViewGroup))return;ViewGroup vg=(ViewGroup)currentRootView;TextView tv=vg.findViewWithTag("drg_prog_pill");if(hide){if(tv!=null)vg.removeView(tv);return;}if(tv==null){tv=new TextView(vg.getContext());tv.setTag("drg_prog_pill");tv.setTextColor(Color.WHITE);tv.setTextSize(TypedValue.COMPLEX_UNIT_DIP,13);tv.setPadding(AndroidUtilities.dp(16),AndroidUtilities.dp(8),AndroidUtilities.dp(16),AndroidUtilities.dp(8));tv.setBackground(makeLiquidGlass(20));FrameLayout.LayoutParams lp=new FrameLayout.LayoutParams(-2,-2,Gravity.TOP|Gravity.CENTER_HORIZONTAL);lp.topMargin=AndroidUtilities.dp(52);vg.addView(tv,lp);}tv.setText(text);tv.bringToFront();}catch(Throwable ignored){}});}
          private static String lang(){try{String l=LocaleController.getInstance().getCurrentLocaleInfo().getLangCode();return l!=null?l.toLowerCase(Locale.US):"en";}catch(Throwable t){return "en";}}
          public static String tr(String uk,String ru,String en){String l=lang();return l.startsWith("uk")?uk:(l.startsWith("ru")?ru:en);}
          public static void toast(final String m){H.post(()->{try{Toast.makeText(ApplicationLoader.applicationContext,m,Toast.LENGTH_SHORT).show();}catch(Throwable ignored){}});}
          private static String now(){return new SimpleDateFormat("dd.MM.yyyy HH:mm:ss",Locale.getDefault()).format(new Date());}
          public static void log(int a,String e){try{String o=sp(a).getString("log",""),u="["+now()+"] "+e+"\n"+o;if(u.length()>25000)u=u.substring(0,25000);sp(a).edit().putString("log",u).apply();}catch(Throwable ignored){}}
          public static boolean isAntiDelete(int a){return sp(a).getBoolean("anti_del",false);}
          public static boolean isUnlimitedSelect(int a){return sp(a).getBoolean("unlim_sel",true);}
          public static boolean isVoiceTiming(int a){return sp(a).getBoolean("voice_time",false);}
          public static int getVoiceMode(int a){return sp(a).getInt("voice_mode",0);}
          public static boolean isMutedPm(int a,long did){return did>0&&sp(a).getBoolean("mute_pm_"+did,false);}
          public static boolean isGhostOpt(int a,int idx){return sp(a).getBoolean("ghost_"+idx,false);}
          public static int getGhostCount(int a){int c=0;for(int i=0;i<5;i++)if(isGhostOpt(a,i))c++;return c;}
          public static void forceOfflineNow(final int a){if(!isGhostOpt(a,2)&&!isGhostOpt(a,4))return;try{Class<?> cls=null;try{cls=Class.forName("org.telegram.tgnet.tl.TL_account$updateStatus");}catch(Throwable t1){try{cls=Class.forName("org.telegram.tgnet.TLRPC$TL_account_updateStatus");}catch(Throwable ignored){}}if(cls!=null){TLObject req=(TLObject)cls.getDeclaredConstructor().newInstance();cls.getField("offline").setBoolean(req,true);ConnectionsManager.getInstance(a).sendRequest(req,(res,err)->{});}else if(cachedOfflineReq!=null){cachedOfflineReq.getClass().getField("offline").setBoolean(cachedOfflineReq,true);ConnectionsManager.getInstance(a).sendRequest(cachedOfflineReq,(res,err)->{});}}catch(Throwable ignored){}}
          public static boolean handleChunkedDelete(final int a,final ArrayList<Integer> msgs,final ArrayList<Long> rnds,final TLRPC.EncryptedChat enc,final long did,final int topicId,final boolean forAll,final int mode){if(inChunkDel||msgs==null||msgs.size()<=100)return false;sendDeleteChunk(a,new ArrayList<>(msgs),0,rnds,enc,did,topicId,forAll,mode);return true;}
          private static void sendDeleteChunk(final int a,final List<Integer> all,final int st,final ArrayList<Long> rnds,final TLRPC.EncryptedChat enc,final long did,final int topicId,final boolean forAll,final int mode){if(st>=all.size()){updateProgressBanner("",true);return;}final int end=Math.min(st+100,all.size());final ArrayList<Integer> batch=new ArrayList<>(all.subList(st,end));updateProgressBanner(tr("Видалення: ","Удаление: ","Deleting: ")+((end*100)/all.size())+"% ("+end+"/"+all.size()+")",false);H.post(()->{try{inChunkDel=true;MessagesController.getInstance(a).deleteMessages(batch,rnds,enc,did,topicId,forAll,mode);}catch(Throwable ignored){}finally{inChunkDel=false;}});if(end<all.size())H.postDelayed(()->sendDeleteChunk(a,all,end,rnds,enc,did,topicId,forAll,mode),350);else H.postDelayed(()->updateProgressBanner("",true),1500);}
          @SuppressWarnings("unchecked") public static boolean shouldBlockRequest(final int a,final TLObject req){if(req==null)return false;String n=req.getClass().getSimpleName().toLowerCase(Locale.US);if(n.contains("privacy"))return false;if(isGhostOpt(a,0)&&System.currentTimeMillis()>allowReadUntil&&(n.contains("readhistory")||n.contains("readdiscussion")||n.contains("readencrypted")||n.contains("readmessagecontents")))return true;if(isGhostOpt(a,1)&&n.contains("readstories"))return true;if(isGhostOpt(a,3)&&n.contains("settyping"))return true;if(n.contains("updatestatus")){try{if(isGhostOpt(a,2)||isGhostOpt(a,4))req.getClass().getField("offline").setBoolean(req,true);cachedOfflineReq=req;}catch(Throwable ignored){}return false;}if(n.contains("deletemessages")){try{java.lang.reflect.Field idF=req.getClass().getField("id");ArrayList<Integer> ids=(ArrayList<Integer>)idF.get(req);if(ids!=null&&ids.size()>100){List<Integer> copy=new ArrayList<>(ids);idF.set(req,new ArrayList<>(copy.subList(0,100)));for(int s=100;s<copy.size();s+=100){final int st=s,en=Math.min(s+100,copy.size());H.postDelayed(()->{try{TLObject nr=(TLObject)req.getClass().getDeclaredConstructor().newInstance();for(java.lang.reflect.Field f:req.getClass().getFields()){try{f.set(nr,f.get(req));}catch(Throwable ignored){}}idF.set(nr,new ArrayList<>(copy.subList(st,en)));ConnectionsManager.getInstance(a).sendRequest(nr,(r2,e2)->{});}catch(Throwable ignored){}},(s/100)*350L);}}}catch(Throwable ignored){}}if(n.contains("sendmessage")||n.contains("sendmedia")||n.contains("sendmulti")||n.contains("forwardmessages")||n.contains("sendreaction")){if(sp(a).getBoolean("ghost_read_inter",true))allowReadUntil=System.currentTimeMillis()+3000L;if(isGhostOpt(a,2)||isGhostOpt(a,4))for(int d:new int[]{150,1200})H.postDelayed(()->forceOfflineNow(a),d);}return false;}
          public static int readAudio(AudioRecord rec,ByteBuffer buf,int size){int len=rec.read(buf,size);if(len>0)processByteBufferPcm(buf,len);return len;}
          public static int readAudio(AudioRecord rec,short[] s,int off,int size){int len=rec.read(s,off,size);if(len>0)processShortsPcm(s,off,len);return len;}
          public static int readAudio(AudioRecord rec,byte[] b,int off,int size){int len=rec.read(b,off,size);if(len>1){int cnt=len/2;short[] s=new short[cnt];for(int i=0;i<cnt;i++)s[i]=(short)((b[off+i*2]&0xFF)|(b[off+i*2+1]<<8));processShortsPcm(s,0,cnt);for(int i=0;i<cnt;i++){b[off+i*2]=(byte)(s[i]&0xFF);b[off+i*2+1]=(byte)((s[i]>>8)&0xFF);}}return len;}
          public static void processByteBufferPcm(ByteBuffer buf,int len){int mode=getVoiceMode(lastAccount);if(mode<=0||buf==null||len<2)return;try{buf.order(ByteOrder.LITTLE_ENDIAN);int cnt=len/2;short[] s=new short[cnt];for(int i=0;i<cnt;i++)s[i]=buf.getShort(i*2);processShortsPcm(s,0,cnt);for(int i=0;i<cnt;i++)buf.putShort(i*2,s[i]);}catch(Throwable ignored){}}
          public static void processShortsPcm(short[] pcm,int off,int count){int mode=getVoiceMode(lastAccount);if(mode<=0||pcm==null||count<=0)return;double pitch=mode==1?1.28:(mode==2?1.14:(mode==3?0.88:(mode==4?0.75:(mode==5?0.95:1.45))));final int W=1024;for(int i=0;i<count;i++){float x=pcm[off+i]/32768.0f;vRing[vWrite&8191]=x;double d1=vPhase*W,d2=((vPhase+0.5)%1.0)*W,r1=vWrite-d1,r2=vWrite-d2;if(r1<0)r1+=8192;if(r2<0)r2+=8192;int i1=(int)r1,i2=(int)r2;float f1=(float)(r1-i1),f2=(float)(r2-i2);float s1=vRing[i1&8191]*(1.0f-f1)+vRing[(i1+1)&8191]*f1,s2=vRing[i2&8191]*(1.0f-f2)+vRing[(i2+1)&8191]*f2;double w1=0.5*(1.0-Math.cos(2.0*Math.PI*vPhase)),y=s1*w1+s2*(1.0-w1);vPhase+=(1.0-pitch)/W;vPhase-=Math.floor(vPhase);vWrite=(vWrite+1)&8191;if(mode==5){vRobPhase+=2.0*Math.PI*60.0/48000.0;if(vRobPhase>2.0*Math.PI)vRobPhase-=2.0*Math.PI;y=y*(0.65+0.55*Math.sin(vRobPhase))+0.25*vLp1;vLp1=y;}else if(mode==1||mode==2){vLp1+=0.55*(y-vLp1);vLp2+=0.65*(vLp1-vLp2);y=vLp2*1.12;}else if(mode==3||mode==4){vLp1+=0.25*(y-vLp1);y=(y*0.8+vLp1*0.45)*1.15;}else if(mode==6){vLp1+=0.75*(y-vLp1);y=vLp1*1.1;}int out=(int)Math.round(y*32767.0);pcm[off+i]=(short)Math.max(-32768,Math.min(32767,out));}}
          public static CharSequence processOutgoingWithTiming(int a,CharSequence in){if(in==null||!isVoiceTiming(a))return in;try{MessageObject mo=MediaController.getInstance().getPlayingMessageObject();if(mo!=null&&mo.audioProgressSec>0){int sec=mo.audioProgressSec;String ts=String.format(Locale.US,"%02d:%02d ",sec/60,sec%60);if(!in.toString().startsWith(ts.trim()))return ts+in;}}catch(Throwable ignored){}return in;}
          private static String calcRegDate(long uid){long[][] pts={{1000000L,1378000000L},{50000000L,1420070400L},{150000000L,1451606400L},{300000000L,1483228800L},{500000000L,1514764800L},{800000000L,1546300800L},{1200000000L,1585699200L},{1700000000L,1614556800L},{2200000000L,1640995200L},{5200000000L,1656633600L},{6000000000L,1677628800L},{6800000000L,1704067200L},{7500000000L,1725148800L},{8200000000L,1743465600L},{9000000000L,1788220800L}};long ts=pts[pts.length-1][1];if(uid<=pts[0][0])ts=pts[0][1];else{for(int i=0;i<pts.length-1;i++){if(uid>=pts[i][0]&&uid<=pts[i+1][0]){double f=(double)(uid-pts[i][0])/(double)(pts[i+1][0]-pts[i][0]);ts=pts[i][1]+(long)(f*(pts[i+1][1]-pts[i][1]));break;}}}return new SimpleDateFormat("dd.MM.yyyy",Locale.getDefault()).format(new Date(ts*1000L));}
