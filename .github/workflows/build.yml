          public static void checkOnline(int a,TLRPC.User u){if(u==null||u.id==777000||!isWatched(a,u.id))return;if(u.access_hash!=0)sp(a).edit().putLong("whash_"+u.id,u.access_hash).apply();boolean on=isStatusOnline(a,u.status);String mk=a+"_"+u.id;Boolean p=onlineMap.get(mk);onlineMap.put(mk,on);String who=userLabel(u,u.id);if(on&&(p==null||!p)){onlineSince.put(mk,System.currentTimeMillis());String m=who+tr(" — В МЕРЕЖІ (ОНЛАЙН)"," — В СЕТИ (ОНЛАЙН)"," — ONLINE");log(a,m);notify(tr("Онлайн радар","Онлайн радар","Online Radar"),m);}else if(!on&&p!=null&&p){Long st=onlineSince.get(mk);long dur=st!=null?Math.max(1,(System.currentTimeMillis()-st)/1000):0;String m=who+tr(" — ВИЙШОВ З МЕРЕЖІ"," — ВЫШЕЛ ИЗ СЕТИ"," — OFFLINE")+(dur>0?(" ("+(dur/60)+"m "+(dur%60)+"s)"):"");log(a,m);notify(tr("Онлайн радар","Онлайн радар","Online Radar"),m);}}
          @SuppressWarnings("unchecked") public static void onProcessUpdates(int a,ArrayList<TLRPC.Update> ups){startWatcher();if(ups==null)return;try{Iterator<TLRPC.Update> it=ups.iterator();while(it.hasNext()){TLRPC.Update u=it.next();if(u==null)continue;String cn=u.getClass().getSimpleName();if(cn.contains("updateNewMessage")&&!cn.contains("Channel")){try{Object mo=u.getClass().getField("message").get(u);if(mo instanceof TLRPC.Message){TLRPC.Message m=(TLRPC.Message)mo;if(m.peer_id!=null&&m.peer_id.user_id>0&&m.peer_id.chat_id==0&&m.peer_id.channel_id==0){long uid=m.peer_id.user_id;if(m.message!=null)saveMsgCache(a,m.id,m.out?UserConfig.getInstance(a).getClientUserId():uid,m.message);if(!m.out&&isMutedPm(a,uid)){TLRPC.TL_messages_deleteMessages req=new TLRPC.TL_messages_deleteMessages();req.revoke=true;req.id.add(m.id);ConnectionsManager.getInstance(a).sendRequest(req,(res,err)->{});ArrayList<Integer> del=new ArrayList<>();del.add(m.id);MessagesController.getInstance(a).deleteMessages(del,null,null,uid,0,true,0);it.remove();continue;}}}}catch(Throwable ignored){}}else if(cn.contains("updateUserStatus")){try{long uid=u.getClass().getField("user_id").getLong(u);TLRPC.UserStatus st=(TLRPC.UserStatus)u.getClass().getField("status").get(u);TLRPC.User usr=MessagesController.getInstance(a).getUser(uid);if(usr==null){usr=new TLRPC.TL_user();usr.id=uid;}usr.status=st;checkOnline(a,usr);}catch(Throwable ignored){}}else if(cn.contains("updateDeleteMessages")&&!cn.contains("Channel")&&isAntiDelete(a)){try{markDeleted(a,(ArrayList<Integer>)u.getClass().getField("messages").get(u));it.remove();}catch(Throwable ignored){}}}}catch(Throwable ignored){}}
