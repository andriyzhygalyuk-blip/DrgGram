              ("TMessagesProj/src/main/java/org/telegram/messenger/NotificationsService.java", r"(public\s+void\s+onCreate\s*\(\s*\)\s*\{)", r"\1 org.telegram.messenger.DrgPluginManager.ensureForegroundService(this);")
          ]:
              if os.path.exists(p):
                  with open(p, "r", encoding="utf-8") as f: s = f.read()
                  with open(p, "w", encoding="utf-8") as f: f.write(re.sub(pat, rep, s, count=1))
          EOF
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile DrgGram APK
        run: |
          gradle --parallel :TMessagesProj_AppStandalone:assembleAfatStandalone
          find . -path "*/outputs/apk/*" -name "*.apk" -exec cp {} ./DrgGram.apk \;
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrgGram-APK
          path: ./DrgGram.apk
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: "DrgGram v2.1 (Build #${{ github.run_number }})"
          body: "Офіційні ключі DrgGram + 6 кастомних іконок + Режим привида + Зміна голосу + Таймінг ГС + Мут в ЛС + Профіль ID/DC/Вік!"
          files: ./DrgGram.apk
