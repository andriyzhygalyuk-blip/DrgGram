      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile DrgGram APK
        run: |
          gradle --parallel :TMessagesProj_AppStandalone:assembleAfatStandalone
          find . -path "*/outputs/apk/*" -name "*.apk" -exec cp {} ./DrgGram.apk \;
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrgGram-APK
          path: ./DrgGram.apk
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.28.${{ github.run_number }}
          name: "DrgGram v2.28 (Build #${{ github.run_number }})"
          body: "Звук DrgGram Intro.wav + нові іконки drg_ic_1..6 + рідне прозоре меню DrgPlugins + автопідписка @DrgGram!"
          files: ./DrgGram.apk
