name: Build DrgGram APK
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/* || true
      - name: Checkout DrgGram
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize Submodules
        run: |
          git submodule init
          git submodule update --init --recursive --depth=1
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK & NDK
        run: |
          API_VER=$(grep '^ENV ANDROID_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36")
          BT_VER=$(grep '^ENV ANDROID_BUILD_TOOLS_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36.0.0")
          NDK_VER=$(grep '^ENV ANDROID_NDK_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "27.2.12479018")
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}" "ndk;${NDK_VER}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
      - name: Create DrgPluginManager.java
        run: |
          cat << 'EOF' > TMessagesProj/src/main/java/org/telegram/messenger/DrgPluginManager.java
          package org.telegram.messenger;
          import android.app.*;
          import android.content.*;
          import android.os.*;
          import android.widget.Toast;
          import org.telegram.tgnet.*;
          import java.text.SimpleDateFormat;
          import java.util.*;
          public class DrgPluginManager {
          private static final String SP="drg_state",CH="drg_ch",BG="drg_bg";
          public static volatile long lastDialogId=0;
          public static volatile int lastAccount=0;
          private static boolean started=false;
          private static final Map<Long,Boolean> onlineMap=new HashMap<>();
          private static final Map<Integer,String> msgCache=new HashMap<>();
          private static final Handler H=new Handler(Looper.getMainLooper());
          private static SharedPreferences sp(){return ApplicationLoader.applicationContext.getSharedPreferences(SP,0);}
          public static void toast(final String m){H.post(()->{try{Toast.makeText(ApplicationLoader.applicationContext,m,Toast.LENGTH_LONG).show();}catch(Throwable ignored){}});}
          private static String now(){return new SimpleDateFormat("dd.MM HH:mm:ss",Locale.getDefault()).format(new Date());}
          public static void log(String e){try{String o=sp().getString("log","");String u="["+now()+"] "+e+"\n"+o;if(u.length()>15000)u=u.substring(0,15000);sp().edit().putString("log",u).apply();}catch(Throwable ignored){}}
          public static boolean isAntiDeleteEnabled(){try{return sp().getBoolean("anti_del",true);}catch(Throwable t){return true;}}
          public static Set<String> watched(){try{return new HashSet<>(sp().getStringSet("watched",new HashSet<>()));}catch(Throwable t){return new HashSet<>();}}
          public static boolean isWatched(long id){return watched().contains(String.valueOf(id));}
          public static void toggleWatch(long id,String n){Set<String> s=watched();String k=String.valueOf(id);if(s.contains(k)){s.remove(k);toast("🔴 Стеження за «"+n+"» ВИМКНЕНО");}else{s.add(k);toast("🟢 Стеження за «"+n+"» УВІМКНЕНО!");startWatcher();}sp().edit().putStringSet("watched",s).apply();}
          public static void markDeleted(int acc,ArrayList<Integer> ids){if(ids==null||ids.isEmpty())return;try{Set<String> d=new HashSet<>(sp().getStringSet("del_ids",new HashSet<>()));StringBuilder sb=new StringBuilder();for(Integer id:ids){if(id==null)continue;d.add(String.valueOf(id));String c=msgCache.get(id);if(c!=null)sb.append(c).append(" ");}sp().edit().putStringSet("del_ids",d).apply();String inf=sb.length()>0?sb.toString().trim():("ID: "+ids);log("🗑 Видалено СМС: "+inf);notify("🗑 Збережено видалене СМС!",inf);}catch(Throwable ignored){}}
          public static boolean isMessageDeleted(int id){try{return sp().getStringSet("del_ids",Collections.emptySet()).contains(String.valueOf(id));}catch(Throwable t){return false;}}
          public static void notify(String t,String msg){try{Context c=ApplicationLoader.applicationContext;NotificationManager nm=(NotificationManager)c.getSystemService(Context.NOTIFICATION_SERVICE);if(Build.VERSION.SDK_INT>=26){NotificationChannel ch=new NotificationChannel(CH,"DrgGram",NotificationManager.IMPORTANCE_HIGH);nm.createNotificationChannel(ch);}Notification.Builder b=Build.VERSION.SDK_INT>=26?new Notification.Builder(c,CH):new Notification.Builder(c);b.setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(t).setContentText(msg).setAutoCancel(true);nm.notify(new Random().nextInt(900000)+1000,b.build());}catch(Throwable ignored){}}
          public static void ensureForegroundService(Service s){try{startWatcher();if(Build.VERSION.SDK_INT>=26){NotificationManager nm=(NotificationManager)s.getSystemService(Context.NOTIFICATION_SERVICE);nm.createNotificationChannel(new NotificationChannel(BG,"DrgGram Радар",NotificationManager.IMPORTANCE_LOW));s.startForeground(777888,new Notification.Builder(s,BG).setContentTitle("⚡ DrgGram активний у фоні").setContentText("Радар онлайну та Анти-Видалення працюють").setSmallIcon(android.R.drawable.ic_popup_sync).build());}}catch(Throwable ignored){}}
          public static void startWatcher(){if(started)return;started=true;H.postDelayed(new Runnable(){@Override public void run(){try{final int a=lastAccount;if(isAntiDeleteEnabled()||!watched().isEmpty()){ConnectionsManager.getInstance(a).setAppPaused(false,false);ConnectionsManager.getInstance(a).resumeNetworkMaybe();}Set<String> w=watched();if(!w.isEmpty()){TLRPC.TL_users_getUsers r=new TLRPC.TL_users_getUsers();for(String s:w){try{TLRPC.InputUser iu=MessagesController.getInstance(a).getInputUser(Long.parseLong(s));if(iu!=null)r.id.add(iu);}catch(Throwable ignored){}}if(!r.id.isEmpty())ConnectionsManager.getInstance(a).sendRequest(r,(res,err)->{if(res instanceof org.telegram.tgnet.Vector){org.telegram.tgnet.Vector vec=(org.telegram.tgnet.Vector)res;for(int i=0;i<vec.objects.size();i++){Object o=vec.objects.get(i);if(o instanceof TLRPC.User){TLRPC.User u=(TLRPC.User)o;checkOnline(u.id,u.first_name,u.status);}}}});}}catch(Throwable ignored){}H.postDelayed(this,20000);}},5000);}
          private static void checkOnline(long id,String n,TLRPC.UserStatus st){if(!isWatched(id))return;boolean on=st!=null&&st.getClass().getSimpleName().toLowerCase(Locale.US).contains("online");Boolean p=onlineMap.get(id);onlineMap.put(id,on);String dn=(n!=null&&!n.isEmpty())?n:("ID "+id);if(on&&(p==null||!p)){log("🟢 "+dn+" зараз ОНЛАЙН!");notify("🟢 Контакт онлайн!",dn+" у мережі ("+now()+")");}else if(!on&&p!=null&&p)log("🔴 "+dn+" вийшов з мережі");}
          @SuppressWarnings("unchecked") public static void onProcessUpdates(int a,ArrayList<TLRPC.Update> ups){if(ups==null)return;startWatcher();try{Iterator<TLRPC.Update> it=ups.iterator();while(it.hasNext()){TLRPC.Update u=it.next();if(u==null)continue;String cn=u.getClass().getSimpleName();if(cn.contains("updateNewMessage")||cn.contains("updateNewChannelMessage")){try{Object mo=u.getClass().getField("message").get(u);if(mo instanceof TLRPC.Message){TLRPC.Message m=(TLRPC.Message)mo;if(m.message!=null)msgCache.put(m.id,m.message);}}catch(Throwable ignored){}}else if(cn.contains("updateUserStatus")){try{long uid=u.getClass().getField("user_id").getLong(u);TLRPC.UserStatus st=(TLRPC.UserStatus)u.getClass().getField("status").get(u);TLRPC.User usr=MessagesController.getInstance(a).getUser(uid);checkOnline(uid,usr!=null?usr.first_name:("ID "+uid),st);}catch(Throwable ignored){}}else if((cn.contains("updateDeleteMessages")||cn.contains("updateDeleteChannelMessages"))&&isAntiDeleteEnabled()){try{ArrayList<Integer> ids=(ArrayList<Integer>)u.getClass().getField("messages").get(u);markDeleted(a,ids);it.remove();}catch(Throwable ignored){}}}}catch(Throwable ignored){}}
          public static void onChatResume(long did,int a){lastDialogId=did;lastAccount=a;startWatcher();}
          public static void openDrgMenu(final Context ctx){try{final long did=lastDialogId;final int a=lastAccount;final boolean ad=isAntiDeleteEnabled();final boolean w=did>0&&isWatched(did);String[] items={"📤 Переслати увесь чат в 1 клік (Анти-Флуд)",did>0?("👁 Стежити за онлайном: "+(w?"[УВІМК 🟢]":"[ВИМК 🔴]")):"👁 Стеження за онлайном (відкрийте чат з людиною)","🛡 Зберігати видалені СМС: "+(ad?"[УВІМК 🟢]":"[ВИМК 🔴]"),"📜 Журнал (Видалені СМС та Онлайн)","🗑 Очистити журнал"};new AlertDialog.Builder(ctx).setTitle("⚡ DrgPlugins").setItems(items,(d,i)->{if(i==0){if(did==0)toast("⚠️ Зайдіть у чат!");else pickTarget(ctx,a,did);}else if(i==1){if(did<=0)toast("⚠️ Відкрийте особистий чат!");else{TLRPC.User u=MessagesController.getInstance(a).getUser(did);toggleWatch(did,u!=null?u.first_name:("ID "+did));}}else if(i==2){sp().edit().putBoolean("anti_del",!ad).apply();toast("🛡 Анти-Видалення: "+(!ad?"УВІМК 🟢":"ВИМК 🔴"));}else if(i==3){String l=sp().getString("log","");new AlertDialog.Builder(ctx).setTitle("📜 Журнал").setMessage(l.isEmpty()?"Подій поки немає.":l).setPositiveButton("ОК",null).show();}else if(i==4){sp().edit().putString("log","").apply();toast("🗑 Очищено!");}}).setNegativeButton("Закрити",null).show();}catch(Throwable t){toast("⚠️ "+t.getMessage());}}
          private static void pickTarget(final Context ctx,final int a,final long fromId){try{final List<Long> ids=new ArrayList<>();final List<String> nms=new ArrayList<>();long me=UserConfig.getInstance(a).getClientUserId();ids.add(me);nms.add("⭐ Збережене (Saved Messages)");for(TLRPC.Dialog d:MessagesController.getInstance(a).allDialogs){if(d==null||d.id==me||d.id==fromId)continue;if(d.id>0){TLRPC.User u=MessagesController.getInstance(a).getUser(d.id);if(u!=null){ids.add(d.id);nms.add("👤 "+(u.first_name!=null?u.first_name:"ID "+d.id));}}else if(d.id<0){TLRPC.Chat c=MessagesController.getInstance(a).getChat(-d.id);if(c!=null&&c.title!=null){ids.add(d.id);nms.add("👥 "+c.title);}}if(ids.size()>=60)break;}new AlertDialog.Builder(ctx).setTitle("📤 Куди переслати увесь чат?").setItems(nms.toArray(new String[0]),(d,ix)->{toast("🔍 Збираю повідомлення...");fetchHist(a,fromId,ids.get(ix),0,new ArrayList<>());}).setNegativeButton("Скасувати",null).show();}catch(Throwable t){toast("⚠️ "+t.getMessage());}}
          private static void fetchHist(final int a,final long f,final long t,final int off,final List<Integer> col){TLRPC.TL_messages_getHistory r=new TLRPC.TL_messages_getHistory();r.peer=MessagesController.getInstance(a).getInputPeer(f);r.offset_id=off;r.limit=100;ConnectionsManager.getInstance(a).sendRequest(r,(res,err)->{if(err!=null){if(err.text!=null&&err.text.startsWith("FLOOD_WAIT_")){final int w=parseWait(err.text);H.postDelayed(()->fetchHist(a,f,t,off,col),(w+2)*1000L);}else toast("⚠️ "+err.text);return;}if(res instanceof TLRPC.messages_Messages){TLRPC.messages_Messages ms=(TLRPC.messages_Messages)res;if(ms.messages==null||ms.messages.isEmpty()){startFwd(a,f,t,col);return;}int min=Integer.MAX_VALUE;for(TLRPC.Message m:ms.messages){if(m==null)continue;if(m.id<min)min=m.id;if(!(m instanceof TLRPC.TL_messageService)&&m.id>0)col.add(m.id);}final int nx=min;if(ms.messages.size()<100||nx<=1||nx==off)startFwd(a,f,t,col);else H.postDelayed(()->fetchHist(a,f,t,nx,col),350);}});}
          private static void startFwd(final int a,final long f,final long t,final List<Integer> ids){if(ids.isEmpty()){toast("ℹ️ Чат порожній!");return;}Collections.reverse(ids);toast("🚀 Пересилаю "+ids.size()+" СМС пачками по 100...");fwdBatch(a,f,t,ids,0);}
          private static void fwdBatch(final int a,final long f,final long t,final List<Integer> ids,final int st){if(st>=ids.size()){toast("✅ Усі "+ids.size()+" СМС переслано!");notify("✅ Пересилання завершено!","Переслано "+ids.size()+" повідомлень.");return;}final int end=Math.min(st+100,ids.size());TLRPC.TL_messages_forwardMessages r=new TLRPC.TL_messages_forwardMessages();r.from_peer=MessagesController.getInstance(a).getInputPeer(f);r.to_peer=MessagesController.getInstance(a).getInputPeer(t);r.id=new ArrayList<>(ids.subList(st,end));Random rnd=new Random();for(int i=0;i<r.id.size();i++)r.random_id.add(rnd.nextLong());ConnectionsManager.getInstance(a).sendRequest(r,(res,err)->{if(err!=null&&err.text!=null&&err.text.startsWith("FLOOD_WAIT_")){final int w=parseWait(err.text);toast("⏳ FloodWait "+w+"с...");H.postDelayed(()->fwdBatch(a,f,t,ids,st),(w+2)*1000L);return;}toast("📤 Переслано "+end+" / "+ids.size());H.postDelayed(()->fwdBatch(a,f,t,ids,end),2500);});}
          private static int parseWait(String e){try{return Integer.parseInt(e.replaceAll("[^0-9]",""));}catch(Throwable t){return 15;}}
          public static CharSequence processOutgoing(CharSequence in){return in;}
          }
          EOF
      - name: Patch Package ID & Hooks
        run: |
          python3 << 'EOF'
          import os, re, json, copy
          for root, _, files in os.walk("."):
              for f in files:
                  p = os.path.join(root, f)
                  if f == "build.gradle":
                      try:
                          with open(p, "r", encoding="utf-8") as file: c = file.read()
                          c = c.replace('applicationIdSuffix ".web"', 'applicationIdSuffix ".drggram"').replace("applicationIdSuffix '.web'", "applicationIdSuffix '.drggram'")
                          with open(p, "w", encoding="utf-8") as file: file.write(c)
                      except Exception: pass
                  elif f == "google-services.json":
                      try:
                          with open(p, "r", encoding="utf-8") as file: gs = json.load(file)
                          if "client" in gs and len(gs["client"]) > 0:
                              for pkg in ["org.telegram.messenger.drggram", "org.telegram.messenger.drggram.web"]:
                                  nc = copy.deepcopy(gs["client"][0])
                                  nc["client_info"]["android_client_info"]["package_name"] = pkg
                                  gs["client"].append(nc)
                          with open(p, "w", encoding="utf-8") as file: json.dump(gs, file, indent=2)
                      except Exception: pass
                  elif f == "AndroidManifest.xml":
                      try:
                          with open(p, "r", encoding="utf-8") as file: m = file.read()
                          with open(p, "w", encoding="utf-8") as file: file.write(m.replace("org.telegram.messenger.web.", "org.telegram.messenger.drggram."))
                      except Exception: pass
                  elif f == "strings.xml":
                      try:
                          with open(p, "r", encoding="utf-8") as file: c = file.read()
                          c = re.sub(r'(<string name="AppName">).*?(</string>)', r'\1DrgGram\2', c)
                          c = re.sub(r'(<string name="AppNameBeta">).*?(</string>)', r'\1DrgGram\2', c)
                          with open(p, "w", encoding="utf-8") as file: file.write(c)
                      except Exception: pass
          ab_p = "TMessagesProj/src/main/java/org/telegram/ui/ActionBar/ActionBarMenuItem.java"
          if os.path.exists(ab_p):
              with open(ab_p, "r", encoding="utf-8") as f: ab = f.read()
              h = 'public boolean drgInjected = false; private void injectDrgMenuIfNeeded() { if (!drgInjected && hasSubMenu()) { drgInjected = true; try { android.view.View sub = addSubItem(999777, org.telegram.messenger.R.drawable.msg_settings, "⚡ DrgPlugins"); if (sub != null) { sub.setOnClickListener(v -> { closeSubMenu(); org.telegram.messenger.DrgPluginManager.openDrgMenu(v.getContext()); }); } } catch (Throwable ignored) {} } } public void toggleSubMenu('
              ab, _ = re.subn(r"public\s+void\s+toggleSubMenu\s*\(", h, ab, count=1)
              ab = re.sub(r"(public\s+void\s+toggleSubMenu\s*\([^)]*\)\s*\{)", r"\1 injectDrgMenuIfNeeded();", ab)
              with open(ab_p, "w", encoding="utf-8") as f: f.write(ab)
          for p, pat, rep in [
              ("TMessagesProj/src/main/java/org/telegram/ui/ChatActivity.java", r"(public\s+void\s+onResume\s*\(\s*\)\s*\{)", r"\1 org.telegram.messenger.DrgPluginManager.onChatResume(getDialogId(), currentAccount);"),
              ("TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java", r"(public\s+boolean\s+processUpdateArray\s*\(\s*ArrayList<TLRPC\.Update>\s+(\w+)[^)]*\)\s*\{)", r"\1 org.telegram.messenger.DrgPluginManager.onProcessUpdates(currentAccount, \2);"),
              ("TMessagesProj/src/main/java/org/telegram/messenger/MessagesController.java", r"(public\s+void\s+deleteMessagesByPush\s*\([^)]*\)\s*\{)", r"\1 if (org.telegram.messenger.DrgPluginManager.isAntiDeleteEnabled()) return;"),
              ("TMessagesProj/src/main/java/org/telegram/messenger/MessageObject.java", r"(public\s+CharSequence\s+getMessageText\s*\(\s*\)\s*\{)", r'\1 if (org.telegram.messenger.DrgPluginManager.isMessageDeleted(getId()) && messageText != null && !messageText.toString().startsWith("🗑")) { return "🗑 [ВИДАЛЕНО] " + messageText; }'),
              ("TMessagesProj/src/main/java/org/telegram/messenger/NotificationsService.java", r"(public\s+void\s+onCreate\s*\(\s*\)\s*\{)", r"\1 org.telegram.messenger.DrgPluginManager.ensureForegroundService(this);")
          ]:
              if os.path.exists(p):
                  with open(p, "r", encoding="utf-8") as f: s = f.read()
                  with open(p, "w", encoding="utf-8") as f: f.write(re.sub(pat, rep, s, count=1))
          EOF
          find TMessagesProj/jni -exec touch -d "2025-01-01 00:00:00" {} + || true
      - name: Restore Native C++ Cache (.cxx)
        uses: actions/cache/restore@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: drggram-cxx-32-64-v3
          restore-keys: |
            drggram-cxx-32-64-
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile DrgGram APK
        run: |
          gradle --parallel :TMessagesProj_AppStandalone:assembleAfatStandalone
          find . -path "*/outputs/apk/*" -name "*.apk" -exec cp {} ./DrgGram.apk \;
      - name: Save Native C++ Cache Always
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          key: drggram-cxx-32-64-v4
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrgGram-APK
          path: ./DrgGram.apk
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: "DrgGram v1.2 (Build #${{ github.run_number }})"
          body: "Окремий пакет org.telegram.messenger.drggram (32-bit + 64-bit) + меню ⚡ DrgPlugins!"
          files: ./DrgGram.apk
# === КІНЕЦЬ ФАЙЛУ ===
