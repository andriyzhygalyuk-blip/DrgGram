name: Build DrgGram APK
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/* || true
      - name: Checkout DrgGram
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Initialize Submodules
        run: |
          git submodule init
          git submodule update --init --recursive --depth=1
      - name: Check Prebuilt 100-Account C++ Core (v2)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/prev /tmp/prev_libs
          REL_TAG=$(gh release view --json tagName -q .tagName || echo "")
          if [[ "$REL_TAG" == v2.* ]]; then
            gh release download "$REL_TAG" --pattern "DrgGram.apk" -D /tmp/prev --clobber || true
          fi
          if [ -f /tmp/prev/DrgGram.apk ]; then
            unzip -q /tmp/prev/DrgGram.apk "lib/*/*tmessages*.so" -d /tmp/prev_libs
            mkdir -p TMessagesProj/src/main/jniLibs
            cp -r /tmp/prev_libs/lib/* TMessagesProj/src/main/jniLibs/
            echo "FAST_BUILD=1" >> $GITHUB_ENV
          else
            echo "FAST_BUILD=0" >> $GITHUB_ENV
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK & NDK
        run: |
          API_VER=$(grep '^ENV ANDROID_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36")
          BT_VER=$(grep '^ENV ANDROID_BUILD_TOOLS_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36.0.0")
          NDK_VER=$(grep '^ENV ANDROID_NDK_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "27.2.12479018")
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          if [ "$FAST_BUILD" = "1" ]; then
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}"
          else
            $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-${API_VER}" "build-tools;${BT_VER}" "ndk;${NDK_VER}" "cmake;3.22.1"
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV
          fi
      - name: Create DrgPluginManager.java
        run: |
          cat << 'EOF' > TMessagesProj/src/main/java/org/telegram/messenger/DrgPluginManager.java
          package org.telegram.messenger;
          import android.app.*;
          import android.content.*;
          import android.graphics.*;
          import android.graphics.drawable.*;
          import android.media.AudioRecord;
          import android.os.*;
          import android.text.*;
          import android.text.style.ReplacementSpan;
          import android.util.TypedValue;
          import android.view.*;
          import android.widget.*;
          import org.telegram.tgnet.*;
          import org.telegram.ui.ActionBar.ActionBarMenuSubItem;
          import org.telegram.ui.ActionBar.ActionBarPopupWindow;
          import org.telegram.ui.ActionBar.AlertDialog;
          import org.telegram.ui.ActionBar.Theme;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.text.SimpleDateFormat;
          import java.util.*;
          public class DrgPluginManager {
          private static final String CH="drg_ch";
          private static final String[] DEVS={"S~SM-S948B:37","S~SM-S946B:37","S~SM-S941B:37","S~SM-F976B:37","S~SM-F776B:37","G~11 Pro XL:37","G~11 Pro:37","G~11 Pro Fold:37","G~11:37","Sony XQ-GE54:37","M~XT2651-1:37","M~XT2601-2:37","Asus ASUSAI2601D:37","Asus ASUSAI2601H:37","N~A069P:37","S~SM-S938B:37","S~SM-S936B:37","S~SM-S931B:37","S~SM-F966B:37","S~SM-F766B:37","S~SM-S937B:37","G~10 Pro XL:37","G~10 Pro:37","G~10 Pro Fold:37","G~10:37","G~10a:37","Sony XQ-FS54:37","M~XT2551-6:36","M~XT2503-2:36","M~XT2505-1:36","Asus ASUSAI2501D:36","Asus ASUSAI2501H:36","N~A065:36","N~A059P:36","N~A059:36","S~SM-S928B:36","S~SM-S926B:36","S~SM-S921B:36","S~SM-F956B:36","S~SM-F741B:36","S~SM-S721B:36","G~9 Pro XL:36","G~9 Pro:36","G~9 Pro Fold:36","G~9:36","G~9a:36","Sony XQ-EC54:36","Sony XQ-ES54:35","M~XT2401-1:35","M~XT2451-3:35","M~XT2403-2:35","Asus ASUS_AI2401_A:35","Asus ASUS_AI2401_H:35","N~A015:35","HTC 2QDA100:35","HMD TA-1600:35","S~SM-A576B:36","S~SM-A376B:36","S~SM-A566B:36","S~SM-A366B:36","S~SM-A556B:36","S~SM-A356B:36","S~SM-M556B:35","G~8 Pro:36","G~8:36","G~8a:36","M~XT2429-1:35","M~XT2419-2:35","M~XT2435-1:35","N~A142:35","N~A001:35","HTC 2QCB100:34","HMD TA-1667:35","HMD TA-1632:35","HMD TA-1595:35","S~SM-S918B:35","S~SM-S916B:35","S~SM-S911B:35","S~SM-F946B:35","S~SM-F731B:35","S~SM-S711B:35","S~SM-A546B:35","S~SM-A346B:35","G~Fold:35","G~7 Pro:35","G~7:35","G~7a:35","Sony XQ-DQ54:35","Sony XQ-DE54:35","M~XT2301-4:34","M~XT2321-1:34","M~XT2303-2:34","Asus ASUS_AI2302:34","Asus ASUS_AI2205_A:34","N~A063:34","S~SM-S908B:34","S~SM-S906B:34","S~SM-F936B:34","G~6 Pro:34","Sony XQ-CT54:34"};
          public static volatile long lastDialogId=0;
          public static volatile int lastAccount=0;
          private static volatile long allowReadUntil=0;
          private static volatile TLObject cachedOfflineReq=null;
          private static boolean started=false,themeChecked=false;
          private static final float[] vRing=new float[8192];
          private static int vWrite=0;
          private static double vPhase=0.0,vRobPhase=0.0,vLp1=0.0,vLp2=0.0;
          private static final Map<String,Boolean> onlineMap=new HashMap<>();
          private static final Map<String,Long> onlineSince=new HashMap<>();
          private static final Set<Integer> mutedHandled=Collections.synchronizedSet(new HashSet<>());
          private static final Handler H=new Handler(Looper.getMainLooper());
          private static SharedPreferences sp(int a){return ApplicationLoader.applicationContext.getSharedPreferences("drg_acc_"+a,0);}
          private static SharedPreferences gsp(){return ApplicationLoader.applicationContext.getSharedPreferences("drg_global",0);}
          public static void applyDefaultThemeIfNeeded(){if(themeChecked)return;themeChecked=true;try{if(!gsp().getBoolean("def_dark_set",false)){gsp().edit().putBoolean("def_dark_set",true).apply();Theme.ThemeInfo ti=Theme.getTheme("Night");if(ti!=null)Theme.applyTheme(ti,true);}}catch(Throwable ignored){}}
          public static String getDevProfile(int a){String k="dev_"+a;String v=gsp().getString(k,null);if(v==null){int idx=(a>=0&&a<DEVS.length)?a:new Random().nextInt(DEVS.length);v=DEVS[idx].replace("S~","Samsung ").replace("G~","Google Pixel ").replace("M~","Motorola ").replace("N~","Nothing ");gsp().edit().putString(k,v).apply();}return v;}
          public static String getFakeDeviceModel(int a){return getDevProfile(a).split(":")[0];}
          public static String getFakeSystemVersion(int a){return "SDK "+getDevProfile(a).split(":")[1];}
          public static String getIsolatedRegId(int a,String o){return a==0?o:"";}
          public static List<Integer> getSortedActiveAccounts(){List<Integer> list=new ArrayList<>();for(int i=0;i<100;i++){try{if(UserConfig.getInstance(i).isClientActivated())list.add(i);}catch(Throwable ignored){}}Collections.sort(list,(o1,o2)->Integer.compare(UserConfig.getInstance(o1).loginTime,UserConfig.getInstance(o2).loginTime));return list;}
          public static int getActiveAccountsCount(){return Math.max(1,getSortedActiveAccounts().size());}
          public static String formatAddAccountLabel(String base){if(base!=null&&base.contains("/100)"))return base;String b=(base!=null&&!base.isEmpty())?base:tr("Додати акаунт","Добавить аккаунт","Add Account");return "("+getActiveAccountsCount()+"/100)  "+b;}
          public static void attachAccountReorderHook(final View addAccItem){if(addAccItem==null)return;H.postDelayed(()->{try{ViewParent vp=addAccItem.getParent();if(!(vp instanceof ViewGroup))return;final ViewGroup vg=(ViewGroup)vp;final List<View> accViews=new ArrayList<>();for(int i=0;i<vg.getChildCount();i++){View ch=vg.getChildAt(i);if(ch!=addAccItem&&ch.getVisibility()==View.VISIBLE&&ch.getHeight()>AndroidUtilities.dp(24))accViews.add(ch);}final List<Integer> accIds=getSortedActiveAccounts();for(int i=0;i<accViews.size()&&i<accIds.size();i++){final View row=accViews.get(i);if(row.getTag()!=null&&"drg_drag".equals(row.getTag()))continue;row.setTag("drg_drag");row.setOnLongClickListener(v->{v.performHapticFeedback(HapticFeedbackConstants.LONG_PRESS);v.setAlpha(0.7f);return true;});row.setOnTouchListener(new View.OnTouchListener(){float startY=0;boolean dragging=false;@Override public boolean onTouch(View v,MotionEvent ev){if(v.getAlpha()<0.9f)dragging=true;if(!dragging)return false;if(ev.getAction()==MotionEvent.ACTION_DOWN){startY=ev.getRawY();return true;}else if(ev.getAction()==MotionEvent.ACTION_MOVE){if(startY==0)startY=ev.getRawY();float dy=ev.getRawY()-startY;int step= Math.max(AndroidUtilities.dp(42),v.getHeight());if(Math.abs(dy)>=step){int curIdx=vg.indexOfChild(v);int targetIdx=dy>0?curIdx+1:curIdx-1;int minIdx=vg.indexOfChild(addAccItem)+1;if(targetIdx>=minIdx&&targetIdx<vg.getChildCount()){vg.removeViewAt(curIdx);vg.addView(v,targetIdx);startY=ev.getRawY();v.performHapticFeedback(HapticFeedbackConstants.KEYBOARD_TAP);saveNewOrderFromPopup(vg,addAccItem,accViews,accIds);}}return true;}else if(ev.getAction()==MotionEvent.ACTION_UP||ev.getAction()==MotionEvent.ACTION_CANCEL){v.setAlpha(1.0f);dragging=false;startY=0;return true;}return false;}});}}catch(Throwable ignored){}},150);}
          private static void saveNewOrderFromPopup(ViewGroup vg,View addAcc,List<View> origViews,List<Integer> origAccs){try{int baseTime=100000;int rank=0;for(int i=0;i<vg.getChildCount();i++){View ch=vg.getChildAt(i);int origIdx=origViews.indexOf(ch);if(origIdx>=0&&origIdx<origAccs.size()){int acc=origAccs.get(origIdx);UserConfig.getInstance(acc).loginTime=baseTime+(rank*100);UserConfig.getInstance(acc).saveConfig(false);rank++;}}}catch(Throwable ignored){}}
          public static CharSequence prependSvgTrashSpan(CharSequence timeStr){if(timeStr==null)return null;if(timeStr instanceof Spanned&&timeStr.toString().startsWith("  "))return timeStr;SpannableStringBuilder ssb=new SpannableStringBuilder("  ");ssb.append(timeStr);ssb.setSpan(new ReplacementSpan(){@Override public int getSize(Paint p,CharSequence t,int s,int e,Paint.FontMetricsInt fm){return AndroidUtilities.dp(14);}@Override public void draw(Canvas c,CharSequence t,int s,int e,float x,int top,int y,int bottom,Paint p){try{Drawable d=ApplicationLoader.applicationContext.getResources().getDrawable(R.drawable.msg_delete).mutate();d.setColorFilter(new PorterDuffColorFilter(p.getColor(),PorterDuff.Mode.SRC_IN));int sz=AndroidUtilities.dp(11);int dy=top+(bottom-top-sz)/2;d.setBounds((int)x,dy,(int)x+sz,dy+sz);d.draw(c);}catch(Throwable ignored){}}},0,1,Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);return ssb;}
          public static GradientDrawable makeLiquidGlass(int radDp){GradientDrawable g=new GradientDrawable();g.setColor(0xE618222D);g.setCornerRadius(AndroidUtilities.dp(radDp));g.setStroke(Math.max(1,AndroidUtilities.dp(1)),0x33FFFFFF);return g;}
          private static void stylePopupGlass(ActionBarPopupWindow.ActionBarPopupWindowLayout l){try{l.setBackground(makeLiquidGlass(18));l.setPadding(AndroidUtilities.dp(4),AndroidUtilities.dp(6),AndroidUtilities.dp(4),AndroidUtilities.dp(6));}catch(Throwable ignored){}}
          private static String lang(){try{String l=LocaleController.getInstance().getCurrentLocaleInfo().getLangCode();return l!=null?l.toLowerCase(Locale.US):"en";}catch(Throwable t){return "en";}}
          public static String tr(String uk,String ru,String en){String l=lang();if(l.startsWith("uk"))return uk;if(l.startsWith("ru"))return ru;return en;}
          public static void toast(final String m){H.post(()->{try{Toast.makeText(ApplicationLoader.applicationContext,m,Toast.LENGTH_SHORT).show();}catch(Throwable ignored){}});}
          private static String now(){return new SimpleDateFormat("dd.MM.yyyy HH:mm:ss",Locale.getDefault()).format(new Date());}
          public static void log(int a,String e){try{String o=sp(a).getString("log","");String u="["+now()+"] "+e+"\n"+o;if(u.length()>25000)u=u.substring(0,25000);sp(a).edit().putString("log",u).apply();}catch(Throwable ignored){}}
          public static boolean isAntiDelete(int a){return sp(a).getBoolean("anti_del",false);}
          public static boolean isUnlimitedSelect(int a){return sp(a).getBoolean("unlim_sel",true);}
          public static boolean isVoiceTiming(int a){return sp(a).getBoolean("voice_time",false);}
          public static int getVoiceMode(int a){return sp(a).getInt("voice_mode",0);}
          public static boolean isMutedPm(int a,long did){return did>0&&sp(a).getBoolean("mute_pm_"+did,false);}
          public static boolean isGhostOpt(int a,int idx){return sp(a).getBoolean("ghost_"+idx,false);}
          public static int getGhostCount(int a){int c=0;for(int i=0;i<5;i++)if(isGhostOpt(a,i))c++;return c;}
          public static int readAudio(AudioRecord rec,ByteBuffer buf,int size){int len=rec.read(buf,size);if(len>0)processByteBufferPcm(buf,len);return len;}
          public static int readAudio(AudioRecord rec,short[] s,int off,int size){int len=rec.read(s,off,size);if(len>0)processShortsPcm(s,off,len);return len;}
          public static int readAudio(AudioRecord rec,byte[] b,int off,int size){int len=rec.read(b,off,size);if(len>1){int cnt=len/2;short[] s=new short[cnt];for(int i=0;i<cnt;i++)s[i]=(short)((b[off+i*2]&0xFF)|(b[off+i*2+1]<<8));processShortsPcm(s,0,cnt);for(int i=0;i<cnt;i++){b[off+i*2]=(byte)(s[i]&0xFF);b[off+i*2+1]=(byte)((s[i]>>8)&0xFF);}}return len;}
          public static void processByteBufferPcm(ByteBuffer buf,int len){int mode=getVoiceMode(lastAccount);if(mode<=0||buf==null||len<2)return;try{buf.order(ByteOrder.LITTLE_ENDIAN);int cnt=len/2;short[] s=new short[cnt];for(int i=0;i<cnt;i++)s[i]=buf.getShort(i*2);processShortsPcm(s,0,cnt);for(int i=0;i<cnt;i++)buf.putShort(i*2,s[i]);}catch(Throwable ignored){}}
          public static void processShortsPcm(short[] pcm,int off,int count){int mode=getVoiceMode(lastAccount);if(mode<=0||pcm==null||count<=0)return;double pitch=1.0;if(mode==1)pitch=1.28;else if(mode==2)pitch=1.14;else if(mode==3)pitch=0.88;else if(mode==4)pitch=0.75;else if(mode==5)pitch=0.95;else if(mode==6)pitch=1.45;final int W=1024;for(int i=0;i<count;i++){float x=pcm[off+i]/32768.0f;vRing[vWrite&8191]=x;double d1=vPhase*W;double d2=((vPhase+0.5)%1.0)*W;double r1=vWrite-d1;if(r1<0)r1+=8192;int i1=(int)r1;float f1=(float)(r1-i1);float s1=vRing[i1&8191]*(1.0f-f1)+vRing[(i1+1)&8191]*f1;double r2=vWrite-d2;if(r2<0)r2+=8192;int i2=(int)r2;float f2=(float)(r2-i2);float s2=vRing[i2&8191]*(1.0f-f2)+vRing[(i2+1)&8191]*f2;double w1=0.5*(1.0-Math.cos(2.0*Math.PI*vPhase));double y=s1*w1+s2*(1.0-w1);vPhase+=(1.0-pitch)/W;vPhase-=Math.floor(vPhase);vWrite=(vWrite+1)&8191;if(mode==5){vRobPhase+=2.0*Math.PI*60.0/48000.0;if(vRobPhase>2.0*Math.PI)vRobPhase-=2.0*Math.PI;y=y*(0.65+0.55*Math.sin(vRobPhase))+0.25*vLp1;vLp1=y;}else if(mode==1||mode==2){vLp1=vLp1+0.55*(y-vLp1);vLp2=vLp2+0.65*(vLp1-vLp2);y=vLp2*1.12;}else if(mode==3||mode==4){vLp1=vLp1+0.25*(y-vLp1);y=(y*0.8+vLp1*0.45)*1.15;}else if(mode==6){vLp1=vLp1+0.75*(y-vLp1);y=vLp1*1.1;}int out=(int)Math.round(y*32767.0);if(out>32767)out=32767;else if(out<-32768)out=-32768;pcm[off+i]=(short)out;}}
          public static boolean shouldBlockRequest(final int a,TLObject req){if(req==null)return false;String n=req.getClass().getSimpleName().toLowerCase(Locale.US);if(isGhostOpt(a,0)&&System.currentTimeMillis()>allowReadUntil&&(n.contains("readhistory")||n.contains("readdiscussion")||n.contains("readencrypted")||n.contains("readmessagecontents")))return true;if(isGhostOpt(a,1)&&n.contains("readstories"))return true;if(isGhostOpt(a,3)&&n.contains("settyping"))return true;if(n.contains("updatestatus")){try{req.getClass().getField("offline").setBoolean(req,true);cachedOfflineReq=req;}catch(Throwable ignored){}if(isGhostOpt(a,2)||isGhostOpt(a,4))return false;}if(n.contains("sendmessage")||n.contains("sendmedia")){if(sp(a).getBoolean("ghost_sched",false)){try{java.lang.reflect.Field f=req.getClass().getField("schedule_date");if(f.getInt(req)==0)f.setInt(req,ConnectionsManager.getInstance(a).getCurrentTime()+12);}catch(Throwable ignored){}}if(sp(a).getBoolean("ghost_read_inter",true))allowReadUntil=System.currentTimeMillis()+3000L;if((isGhostOpt(a,2)||isGhostOpt(a,4))&&cachedOfflineReq!=null){H.postDelayed(()->{try{ConnectionsManager.getInstance(a).sendRequest(cachedOfflineReq,(res,err)->{});}catch(Throwable ignored){}},500);}}return false;}
          public static CharSequence processOutgoingWithTiming(int a,CharSequence in){if(in==null)return null;if(!isVoiceTiming(a))return in;try{MessageObject mo=MediaController.getInstance().getPlayingMessageObject();if(mo!=null&&mo.audioProgressSec>0){int sec=mo.audioProgressSec;String ts=String.format(Locale.US,"%02d:%02d ",sec/60,sec%60);if(!in.toString().startsWith(ts.trim()))return ts+in;}}catch(Throwable ignored){}return in;}
          private static String calcRegDate(long uid){long[][] pts={{1000000L,1378000000L},{50000000L,1420070400L},{150000000L,1451606400L},{300000000L,1483228800L},{500000000L,1514764800L},{800000000L,1546300800L},{1200000000L,1585699200L},{1700000000L,1614556800L},{2200000000L,1640995200L},{5200000000L,1656633600L},{6000000000L,1677628800L},{6800000000L,1704067200L},{7500000000L,1725148800L},{8200000000L,1743465600L},{9000000000L,1788220800L}};long ts=pts[pts.length-1][1];if(uid<=pts[0][0])ts=pts[0][1];else{for(int i=0;i<pts.length-1;i++){if(uid>=pts[i][0]&&uid<=pts[i+1][0]){double f=(double)(uid-pts[i][0])/(double)(pts[i+1][0]-pts[i][0]);ts=pts[i][1]+(long)(f*(pts[i+1][1]-pts[i][1]));break;}}}return new SimpleDateFormat("dd.MM.yyyy",Locale.getDefault()).format(new Date(ts*1000L));}
          public static String getProfileBadge(int a,long uid){if(uid<=0)uid=UserConfig.getInstance(a).getClientUserId();if(uid<=0)return "";try{TLRPC.User u=MessagesController.getInstance(a).getUser(uid);int dc=0;if(u!=null&&u.photo!=null)dc=u.photo.dc_id;String dcStr=dc>0?("DC"+dc):"DC2";String dt=calcRegDate(uid);return "ID: "+uid+"  •  "+dcStr+"  •  "+tr("Дата: ","Дата: ","Created: ")+dt;}catch(Throwable t){return "ID: "+uid;}}
          public static void attachProfileBadge(final View root,final int a,final long rawUid){if(!(root instanceof ViewGroup))return;H.postDelayed(()->{try{long uid=rawUid!=0?rawUid:UserConfig.getInstance(a).getClientUserId();if(uid<=0)return;ViewGroup vg=(ViewGroup)root;View old=vg.findViewWithTag("drg_prof_badge");if(old!=null)vg.removeView(old);final String b=getProfileBadge(a,uid);final long fUid=uid;TextView tv=new TextView(vg.getContext());tv.setTag("drg_prof_badge");tv.setText(b);tv.setTextColor(Color.WHITE);tv.setTextSize(TypedValue.COMPLEX_UNIT_DIP,12);tv.setPadding(AndroidUtilities.dp(14),AndroidUtilities.dp(7),AndroidUtilities.dp(14),AndroidUtilities.dp(7));tv.setBackground(makeLiquidGlass(20));FrameLayout.LayoutParams lp=new FrameLayout.LayoutParams(-2,-2,Gravity.TOP|Gravity.CENTER_HORIZONTAL);lp.topMargin=AndroidUtilities.dp(46);tv.setOnClickListener(v->{AndroidUtilities.addToClipboard(String.valueOf(fUid));toast(tr("ID скопійовано: ","ID скопирован: ","ID copied: ")+fUid);});vg.addView(tv,lp);}catch(Throwable ignored){}},250);}
          public static Set<String> watched(int a){return new HashSet<>(sp(a).getStringSet("watched",new HashSet<>()));}
          public static boolean isWatched(int a,long id){return watched(a).contains(String.valueOf(id));}
          public static void toggleWatch(int a,long id){Set<String> s=watched(a);String k=String.valueOf(id);if(s.contains(k))s.remove(k);else{s.add(k);startWatcher();TLRPC.User u=MessagesController.getInstance(a).getUser(id);if(u!=null){onlineMap.remove(a+"_"+id);checkOnline(a,u);}}sp(a).edit().putStringSet("watched",s).apply();}
          public static void saveMsgCache(int a,int mid,long uid,String text){if(mid<=0||text==null||text.isEmpty())return;try{TLRPC.User u=MessagesController.getInstance(a).getUser(uid);String info=userLabel(u,uid)+": «"+text+"»";sp(a).edit().putString("mc_"+mid,info).apply();}catch(Throwable ignored){}}
          public static void onMessageObserved(final int a,final MessageObject mo){if(mo==null||mo.messageOwner==null)return;try{final long did=mo.getDialogId();if(did<=0)return;final int mid=mo.getId();String txt=mo.messageOwner.message;if((txt==null||txt.isEmpty())&&mo.messageText!=null)txt=mo.messageText.toString();if(mid>0&&txt!=null&&!txt.isEmpty())saveMsgCache(a,mid,mo.isOut()?UserConfig.getInstance(a).getClientUserId():did,txt);if(!mo.isOut()&&isMutedPm(a,did)&&mid>0&&!mutedHandled.contains(mid)){mutedHandled.add(mid);H.post(()->{try{TLRPC.TL_messages_deleteMessages req=new TLRPC.TL_messages_deleteMessages();req.revoke=true;req.id.add(mid);ConnectionsManager.getInstance(a).sendRequest(req,(res,err)->{});ArrayList<Integer> del=new ArrayList<>();del.add(mid);MessagesController.getInstance(a).deleteMessages(del,null,null,did,0,true,0);}catch(Throwable ignored){}});}}catch(Throwable ignored){}}
