name: Build DrgGram APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android/sdk/ndk/* || true
          df -h

      - name: Checkout DrgGram
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize Submodules
        run: |
          git submodule init
          git submodule update --init --recursive --depth=1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          API_VER=$(grep '^ENV ANDROID_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36")
          BT_VER=$(grep '^ENV ANDROID_BUILD_TOOLS_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "36.0.0")
          NDK_VER=$(grep '^ENV ANDROID_NDK_VERSION=' Dockerfile | cut -d= -f2 | tr -d ' \r' || echo "27.2.12479018")
          [ -z "$API_VER" ] && API_VER="36"
          [ -z "$BT_VER" ] && BT_VER="36.0.0"
          [ -z "$NDK_VER" ] && NDK_VER="27.2.12479018"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;android-${API_VER}" \
            "build-tools;${BT_VER}" \
            "ndk;${NDK_VER}" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VER}" >> $GITHUB_ENV

      - name: Cache Native C++ Build (.cxx)
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
          key: drggram-cxx-arm64-v1

      - name: Inject Unique Package ID (org.telegram.messenger.drggram) & DrgPlugins
        run: |
          python3 - << 'EOF'
          import os, re, json, copy

          # 0. Унікальний пакет org.telegram.messenger.drggram + прискорення збірки (тільки arm64-v8a)
          for root, _, files in os.walk("."):
              for f in files:
                  p = os.path.join(root, f)
                  if f == "build.gradle":
                      try:
                          with open(p, "r", encoding="utf-8") as file:
                              c = file.read()
                          c = c.replace('applicationIdSuffix ".web"', 'applicationIdSuffix ".drggram"')
                          c = c.replace("applicationIdSuffix '.web'", "applicationIdSuffix '.drggram'")
                          c = c.replace('"org.telegram.messenger.web"', '"org.telegram.messenger.drggram"')
                          c = c.replace("'org.telegram.messenger.web'", "'org.telegram.messenger.drggram'")
                          if "TMessagesProj_AppStandalone" in p and ".drggram" not in c:
                              c = c.replace('applicationId "org.telegram.messenger"', 'applicationId "org.telegram.messenger.drggram"')
                          # Залишаємо тільки 64-бітну архітектуру arm64-v8a (збірка у 2 рази швидша!)
                          c = re.sub(r'abiFilters\s+"armeabi-v7a"\s*,\s*"arm64-v8a"\s*,\s*"x86"\s*,\s*"x86_64"', 'abiFilters "arm64-v8a"', c)
                          c = re.sub(r'abiFilters\s+"armeabi-v7a"\s*,\s*"arm64-v8a"', 'abiFilters "arm64-v8a"', c)
                          with open(p, "w", encoding="utf-8") as file:
                              file.write(c)
                      except Exception:
                          pass
                  elif f == "google-services.json":
                      try:
                          with open(p, "r", encoding="utf-8") as file:
                              gs = json.load(file)
                          if "client" in gs and len(gs["client"]) > 0:
                              for pkg in ["org.telegram.messenger.drggram", "org.telegram.messenger.drggram.web"]:
                                  new_client = copy.deepcopy(gs["client"][0])
                                  new_client["client_info"]["android_client_info"]["package_name"] = pkg
                                  gs["client"].append(new_client)
                          with open(p, "w", encoding="utf-8") as file:
                              json.dump(gs, file, indent=2)
                      except Exception:
                          pass
                  elif f == "AndroidManifest.xml":
                      try:
                          with open(p, "r", encoding="utf-8") as file:
                              m = file.read()
                          m = m.replace("org.telegram.messenger.web", "org.telegram.messenger.drggram")
                          with open(p, "w", encoding="utf-8") as file:
                              file.write(m)
                      except Exception:
                          pass

          # 1. Перейменування Telegram -> DrgGram
          for root, _, files in os.walk("."):
              for f in files:
                  if f == "strings.xml":
                      p = os.path.join(root, f)
                      try:
                          with open(p, "r", encoding="utf-8") as file:
                              c = file.read()
                          c = re.sub(r'(<string name="AppName">).*?(</string>)', r'\1DrgGram\2', c)
                          c = re.sub(r'(<string name="AppNameBeta">).*?(</string>)', r'\1DrgGram\2', c)
                          with open(p, "w", encoding="utf-8") as file:
                              file.write(c)
                      except Exception:
                          pass

          # 2. Створення повного ядра DrgPluginManager.java
          plugin_mgr_path = "TMessagesProj/src/main/java/org/telegram/messenger/DrgPluginManager.java"
          plugin_mgr_code = """package org.telegram.messenger;

          import android.app.AlertDialog;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Toast;
          import org.telegram.tgnet.ConnectionsManager;
          import org.telegram.tgnet.TLRPC;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.Random;
          import java.util.Set;

          public class DrgPluginManager {
              private static final String STATE_PREFS = "drg_system_state";
              private static final String CHANNEL_ID = "drg_alerts_channel";
              private static final String BG_CHANNEL_ID = "drg_bg_guard";

              public static volatile long lastDialogId = 0;
              public static volatile int lastAccount = 0;
              private static boolean watcherStarted = false;
              private static final Map<Long, Boolean> lastOnlineState = new HashMap<>();
              private static final Map<Integer, String> recentMsgTextCache = new HashMap<>();
              private static final Handler mainHandler = new Handler(Looper.getMainLooper());

              private static SharedPreferences getStatePrefs() {
                  return ApplicationLoader.applicationContext.getSharedPreferences(STATE_PREFS, Context.MODE_PRIVATE);
              }

              public static void toast(final String msg) {
                  mainHandler.post(() -> {
                      try {
                          Toast.makeText(ApplicationLoader.applicationContext, msg, Toast.LENGTH_LONG).show();
                      } catch (Throwable ignored) {}
                  });
              }

              private static String nowStr() {
                  return new SimpleDateFormat("dd.MM HH:mm:ss", Locale.getDefault()).format(new Date());
              }

              public static void addLog(String entry) {
                  try {
                      SharedPreferences sp = getStatePrefs();
                      String old = sp.getString("event_log", "");
                      String updated = "[" + nowStr() + "] " + entry + "\\n" + old;
                      if (updated.length() > 15000) updated = updated.substring(0, 15000);
                      sp.edit().putString("event_log", updated).apply();
                  } catch (Throwable ignored) {}
              }

              public static boolean isAntiDeleteEnabled() {
                  try {
                      return getStatePrefs().getBoolean("anti_delete", true);
                  } catch (Throwable t) {
                      return true;
                  }
              }

              public static Set<String> getWatchedUsers() {
                  try {
                      return new HashSet<>(getStatePrefs().getStringSet("watched_users", new HashSet<>()));
                  } catch (Throwable t) {
                      return new HashSet<>();
                  }
              }

              public static boolean isUserWatched(long userId) {
                  return getWatchedUsers().contains(String.valueOf(userId));
              }

              public static void toggleWatchUser(long userId, String name) {
                  Set<String> set = getWatchedUsers();
                  String key = String.valueOf(userId);
                  if (set.contains(key)) {
                      set.remove(key);
                      toast("🔴 Стеження за онлайном «" + name + "» ВИМКНЕНО");
                  } else {
                      set.add(key);
                      toast("🟢 Стеження за онлайном «" + name + "» УВІМКНЕНО (навіть у фоні!)");
                      startBackgroundWatcher();
                  }
                  getStatePrefs().edit().putStringSet("watched_users", set).apply();
              }

              public static void markDeleted(int account, ArrayList<Integer> msgIds) {
                  if (msgIds == null || msgIds.isEmpty()) return;
                  try {
                      SharedPreferences sp = getStatePrefs();
                      Set<String> delSet = new HashSet<>(sp.getStringSet("deleted_ids", new HashSet<>()));
                      StringBuilder preview = new StringBuilder();
                      for (Integer id : msgIds) {
                          if (id == null) continue;
                          delSet.add(String.valueOf(id));
                          String cached = recentMsgTextCache.get(id);
                          if (cached != null) {
                              preview.append(cached).append(" ");
                          }
                      }
                      sp.edit().putStringSet("deleted_ids", delSet).apply();
                      String info = preview.length() > 0 ? preview.toString().trim() : ("ID: " + msgIds.toString());
                      addLog("🗑 Спроба видалення СМС: " + info);
                      sendSystemNotification("🗑 Збережено видалене повідомлення!", info);
                  } catch (Throwable ignored) {}
              }

              public static boolean isMessageDeleted(int msgId) {
                  try {
                      return getStatePrefs().getStringSet("deleted_ids", Collections.emptySet()).contains(String.valueOf(msgId));
                  } catch (Throwable t) {
                      return false;
                  }
              }

              public static void sendSystemNotification(String title, String text) {
                  try {
                      Context ctx = ApplicationLoader.applicationContext;
                      NotificationManager nm = (NotificationManager) ctx.getSystemService(Context.NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationChannel ch = new NotificationChannel(CHANNEL_ID, "DrgGram Сповіщення", NotificationManager.IMPORTANCE_HIGH);
                          ch.enableVibration(true);
                          nm.createNotificationChannel(ch);
                      }
                      Notification.Builder b = Build.VERSION.SDK_INT >= 26
                              ? new Notification.Builder(ctx, CHANNEL_ID)
                              : new Notification.Builder(ctx);
                      b.setSmallIcon(android.R.drawable.ic_dialog_info)
                       .setContentTitle(title)
                       .setContentText(text)
                       .setAutoCancel(true);
                      nm.notify(new Random().nextInt(900000) + 10000, b.build());
                  } catch (Throwable ignored) {}
              }

              public static void ensureForegroundService(Service service) {
                  try {
                      startBackgroundWatcher();
                      if (Build.VERSION.SDK_INT >= 26) {
                          NotificationManager nm = (NotificationManager) service.getSystemService(Context.NOTIFICATION_SERVICE);
                          NotificationChannel ch = new NotificationChannel(BG_CHANNEL_ID, "DrgGram Фоновий Радар", NotificationManager.IMPORTANCE_LOW);
                          nm.createNotificationChannel(ch);
                          Notification n = new Notification.Builder(service, BG_CHANNEL_ID)
                                  .setContentTitle("⚡ DrgGram активний у фоні")
                                  .setContentText("Захист від видалення СМС та радар онлайну працюють")
                                  .setSmallIcon(android.R.drawable.ic_popup_sync)
                                  .build();
                          service.startForeground(777888, n);
                      }
                  } catch (Throwable ignored) {}
              }

              public static void startBackgroundWatcher() {
                  if (watcherStarted) return;
                  watcherStarted = true;
                  Runnable task = new Runnable() {
                      @Override
                      public void run() {
                          try {
                              int acc = lastAccount;
                              if (isAntiDeleteEnabled() || !getWatchedUsers().isEmpty()) {
                                  ConnectionsManager.getInstance(acc).setAppPaused(false, false);
                                  ConnectionsManager.getInstance(acc).resumeNetworkMaybe();
                              }
                              Set<String> watched = getWatchedUsers();
                              if (!watched.isEmpty()) {
                                  TLRPC.TL_users_getUsers req = new TLRPC.TL_users_getUsers();
                                  for (String sId : watched) {
                                      try {
                                          long uid = Long.parseLong(sId);
                                          TLRPC.InputUser iu = MessagesController.getInstance(acc).getInputUser(uid);
                                          if (iu != null) req.id.add(iu);
                                      } catch (Throwable ignored) {}
                                  }
                                  if (!req.id.isEmpty()) {
                                      ConnectionsManager.getInstance(acc).sendRequest(req, (response, error) -> {
                                          if (response instanceof TLRPC.Vector) {
                                              TLRPC.Vector vec = (TLRPC.Vector) response;
                                              for (Object o : vec.objects) {
                                                  if (o instanceof TLRPC.User) {
                                                      TLRPC.User u = (TLRPC.User) o;
                                                      checkUserOnlineTransition(u.id, u.first_name, u.status);
                                                  }
                                              }
                                          }
                                      });
                                  }
                              }
                          } catch (Throwable ignored) {}
                          mainHandler.postDelayed(this, 20000);
                      }
                  };
                  mainHandler.postDelayed(task, 5000);
              }

              private static void checkUserOnlineTransition(long userId, String name, TLRPC.UserStatus status) {
                  if (!isUserWatched(userId)) return;
                  boolean isOnline = status instanceof TLRPC.TL_userStatusOnline;
                  Boolean prev = lastOnlineState.get(userId);
                  lastOnlineState.put(userId, isOnline);
                  String displayName = (name != null && !name.isEmpty()) ? name : ("ID " + userId);
                  if (isOnline && (prev == null || !prev)) {
                      String msg = "🟢 " + displayName + " зараз ОНЛАЙН!";
                      addLog(msg);
                      sendSystemNotification("🟢 Контакт у мережі!", displayName + " щойно з'явився(-лась) онлайн (" + nowStr() + ")");
                  } else if (!isOnline && prev != null && prev) {
                      addLog("🔴 " + displayName + " вийшов(-ла) з мережі");
                  }
              }

              public static void onProcessUpdates(int account, ArrayList<TLRPC.Update> updates) {
                  if (updates == null) return;
                  startBackgroundWatcher();
                  try {
                      Iterator<TLRPC.Update> it = updates.iterator();
                      while (it.hasNext()) {
                          TLRPC.Update u = it.next();
                          if (u instanceof TLRPC.TL_updateNewMessage) {
                              TLRPC.Message m = ((TLRPC.TL_updateNewMessage) u).message;
                              if (m != null && m.message != null) {
                                  recentMsgTextCache.put(m.id, m.message);
                              }
                          } else if (u instanceof TLRPC.TL_updateNewChannelMessage) {
                              TLRPC.Message m = ((TLRPC.TL_updateNewChannelMessage) u).message;
                              if (m != null && m.message != null) {
                                  recentMsgTextCache.put(m.id, m.message);
                              }
                          } else if (u instanceof TLRPC.TL_updateUserStatus) {
                              TLRPC.TL_updateUserStatus us = (TLRPC.TL_updateUserStatus) u;
                              TLRPC.User user = MessagesController.getInstance(account).getUser(us.user_id);
                              String name = user != null ? user.first_name : ("ID " + us.user_id);
                              checkUserOnlineTransition(us.user_id, name, us.status);
                          } else if (u instanceof TLRPC.TL_updateDeleteMessages) {
                              if (isAntiDeleteEnabled()) {
                                  markDeleted(account, ((TLRPC.TL_updateDeleteMessages) u).messages);
                                  it.remove();
                              }
                          } else if (u instanceof TLRPC.TL_updateDeleteChannelMessages) {
                              if (isAntiDeleteEnabled()) {
                                  markDeleted(account, ((TLRPC.TL_updateDeleteChannelMessages) u).messages);
                                  it.remove();
                              }
                          }
                      }
                  } catch (Throwable ignored) {}
  
