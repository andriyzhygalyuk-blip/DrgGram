          private static void deleteOwnMessages(final int a,final long did,final int off){TLRPC.TL_messages_getHistory r=new TLRPC.TL_messages_getHistory();r.peer=MessagesController.getInstance(a).getInputPeer(did);r.offset_id=off;r.limit=100;ConnectionsManager.getInstance(a).sendRequest(r,(res,err)->{if(res instanceof TLRPC.messages_Messages){TLRPC.messages_Messages ms=(TLRPC.messages_Messages)res;if(ms.messages==null||ms.messages.isEmpty()){toast(tr("Всі ваші СМС видалено","Все ваши СМС удалены","All your messages deleted"));return;}final ArrayList<Integer> own=new ArrayList<>();int min=Integer.MAX_VALUE;for(TLRPC.Message m:ms.messages){if(m==null)continue;if(m.id<min)min=m.id;if(m.out&&m.id>0)own.add(m.id);}if(!own.isEmpty())H.post(()->MessagesController.getInstance(a).deleteMessages(own,null,null,did,0,true,0));final int nx=min;if(ms.messages.size()>=100&&nx>1&&nx!=off)H.postDelayed(()->deleteOwnMessages(a,did,nx),600);else toast(tr("Всі ваші СМС видалено","Все ваши СМС удалены","All your messages deleted"));}});}
          private static void pickTarget(final Context ctx,final int a,final long fromId){try{final List<Long> ids=new ArrayList<>();final List<String> nms=new ArrayList<>();long me=UserConfig.getInstance(a).getClientUserId();ids.add(me);nms.add(tr("Збережене","Избранное","Saved Messages"));for(TLRPC.Dialog d:MessagesController.getInstance(a).allDialogs){if(d==null||d.id==me||d.id==fromId)continue;if(d.id>0){TLRPC.User u=MessagesController.getInstance(a).getUser(d.id);if(u!=null){ids.add(d.id);nms.add(u.first_name!=null?u.first_name:("ID "+d.id));}}else if(d.id<0){TLRPC.Chat c=MessagesController.getInstance(a).getChat(-d.id);if(c!=null&&c.title!=null){ids.add(d.id);nms.add(c.title);}}if(ids.size()>=60)break;}new AlertDialog.Builder(ctx).setTitle(tr("Переслати чат","Переслать чат","Forward chat")).setItems(nms.toArray(new String[0]),(d,ix)->fetchHist(a,fromId,ids.get(ix),0,new ArrayList<>())).setNegativeButton(tr("Скасувати","Отмена","Cancel"),null).show();}catch(Throwable ignored){}}
          private static void fetchHist(final int a,final long f,final long t,final int off,final List<Integer> col){TLRPC.TL_messages_getHistory r=new TLRPC.TL_messages_getHistory();r.peer=MessagesController.getInstance(a).getInputPeer(f);r.offset_id=off;r.limit=100;ConnectionsManager.getInstance(a).sendRequest(r,(res,err)->{if(err!=null){if(err.text!=null&&err.text.startsWith("FLOOD_WAIT_")){final int w=parseWait(err.text);H.postDelayed(()->fetchHist(a,f,t,off,col),(w+2)*1000L);}return;}if(res instanceof TLRPC.messages_Messages){TLRPC.messages_Messages ms=(TLRPC.messages_Messages)res;if(ms.messages==null||ms.messages.isEmpty()){startFwd(a,f,t,col);return;}int min=Integer.MAX_VALUE;for(TLRPC.Message m:ms.messages){if(m==null)continue;if(m.id<min)min=m.id;if(!(m instanceof TLRPC.TL_messageService)&&m.id>0)col.add(m.id);}final int nx=min;if(ms.messages.size()<100||nx<=1||nx==off)startFwd(a,f,t,col);else H.postDelayed(()->fetchHist(a,f,t,nx,col),350);}});}
          private static void startFwd(final int a,final long f,final long t,final List<Integer> ids){if(ids.isEmpty())return;Collections.reverse(ids);fwdBatch(a,f,t,ids,0);}
          private static void fwdBatch(final int a,final long f,final long t,final List<Integer> ids,final int st){if(st>=ids.size()){toast(tr("Пересилання завершено","Пересылка завершена","Forwarding complete"));return;}final int end=Math.min(st+100,ids.size());TLRPC.TL_messages_forwardMessages r=new TLRPC.TL_messages_forwardMessages();r.from_peer=MessagesController.getInstance(a).getInputPeer(f);r.to_peer=MessagesController.getInstance(a).getInputPeer(t);r.id=new ArrayList<>(ids.subList(st,end));Random rnd=new Random();for(int i=0;i<r.id.size();i++)r.random_id.add(rnd.nextLong());ConnectionsManager.getInstance(a).sendRequest(r,(res,err)->{if(err!=null&&err.text!=null&&err.text.startsWith("FLOOD_WAIT_")){final int w=parseWait(err.text);H.postDelayed(()->fwdBatch(a,f,t,ids,st),(w+2)*1000L);return;}H.postDelayed(()->fwdBatch(a,f,t,ids,end),2500);});}
          private static int parseWait(String e){try{return Integer.parseInt(e.replaceAll("[^0-9]",""));}catch(Throwable t){return 15;}}
